<!--
  TITOLO A TRE COLONNE

  Il titolo e' un flex a tre colonne: a sinistra icona + nome pagina, in mezzo i
  comandi, a destra il badge di stato e, in fondo, lo switcher "Mostra Nomi" (spinto
  al bordo destro da margin-left:auto). Le due colonne laterali hanno la stessa
  larghezza (flex:1), cosi' il blocco delle label e dei pulsanti resta centrato
  rispetto a tutta la riga del titolo e non solo allo spazio che avanza a destra.
-->
<h4 class="font-weight-bold py-3 mb-4 slicer-title" style="padding-top: 0px !important; ">
  <span class="slicer-title-left">
    <span class="title-icon-box">
      <img src="assets/svg/svg-icon/slicer-icon.svg" alt="Slicer Burley" />
    </span>
    <span class="slicer-title-text">Slicer Burley</span>

    <!-- Comandi di zona (DB120 - FROM_HMI) raccolti sotto un pulsante: la testata resta
         pulita e i comandi restano a un click. Il pannello e' in posizione assoluta
         rispetto a .zone-cmd, quindi non allarga la testata, e resta aperto finche' non
         si ripreme il pulsante, cosi' si possono dare due comandi di fila (es. AUTO e
         poi START). Mode 0=man / 1=AUT, State 0=stop / 1=start.
         Qui BSL_State_ON non e' lo start/stop di una zona ma l'accensione
         della macchina: i pulsanti si chiamano OFF/ON e il badge ACCESO/SPENTO. -->
    <span class="zone-cmd">
      <button type="button" class="btn btn-primary btn-sm zone-cmd-toggle" (click)="cmdOpen = !cmdOpen">
        <i class="fas fa-sliders-h"></i> Comandi
        <i class="fas" [ngClass]="cmdOpen ? 'fa-caret-up' : 'fa-caret-down'"></i>
      </button>
      <!-- Il feedback sta accanto ai pulsanti che lo comandano: il modo operativo a
           destra di MAN/AUTO, lo stato a destra di STOP/START. Prima erano due badge
           in testata, fuori dal menu. -->
      <div class="zone-cmd-panel" *ngIf="cmdOpen">
        <span class="slicer-cmd-group">
          <span class="slicer-cmd-label">Modalità Operativa</span>
          <button (click)="onZoneMode(TagList.FROM_HMI_BSL_Mode_AUTO, 'Slicer Burley', false)" [ngClass]="!TagList.FROM_HMI_BSL_Mode_AUTO.value ? 'btn btn-primary' : 'btn btn-default'" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;margin-right:4px;vertical-align:middle;">MAN</button>
          <button (click)="onZoneMode(TagList.FROM_HMI_BSL_Mode_AUTO, 'Slicer Burley', true)" [ngClass]="TagList.FROM_HMI_BSL_Mode_AUTO.value ? 'btn btn-primary' : 'btn btn-default'" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;vertical-align:middle;">AUTO</button>
          <span class="zone-cmd-badge">
            <span *ngIf="TagList.FROM_HMI_BSL_Mode_AUTO.value" class="badge badge-primary" style="font-size:12px;vertical-align:middle;">AUTOMATICO</span>
            <span *ngIf="!TagList.FROM_HMI_BSL_Mode_AUTO.value" class="badge badge-warning" style="font-size:12px;vertical-align:middle;">MANUALE</span>
          </span>
        </span>
        <span class="slicer-cmd-group">
          <span class="slicer-cmd-label">Stato di funzionamento</span>
          <button (click)="onZoneState(TagList.FROM_HMI_BSL_State_ON, 'Slicer Burley', false)" class="btn btn-danger" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;margin-right:4px;vertical-align:middle;"><i class="fas fa-square"></i> OFF</button>
          <button (click)="onZoneState(TagList.FROM_HMI_BSL_State_ON, 'Slicer Burley', true)" class="btn btn-success" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;vertical-align:middle;"><i class="fas fa-play"></i> ON</button>
          <span class="zone-cmd-badge">
            <span *ngIf="TagList.FROM_HMI_BSL_State_ON.value" class="badge badge-success" style="font-size:12px;vertical-align:middle;">ACCESO</span>
            <span *ngIf="!TagList.FROM_HMI_BSL_State_ON.value" class="badge badge-secondary" style="font-size:12px;vertical-align:middle;">SPENTO</span>
          </span>
        </span>
      </div>
    </span>

  </span>

  <!-- Lo switcher sta da solo nella colonna di destra: il margin-left automatico
       del CSS lo spinge fino al bordo destro della testata. -->
  <span class="slicer-title-right">
    <label class="switcher">
      <input type="checkbox" class="switcher-input" [(ngModel)]="showName">
      <span class="switcher-indicator">
        <span class="switcher-yes"></span>
        <span class="switcher-no"></span>
      </span>
      <span class="switcher-label">Mostra Nomi</span>
    </label>
  </span>
</h4>

        <!--
      FINESTRA PRODUZIONE

      Sostituisce i riquadri e le etichette che erano disegnati in Inkscape (layer
      "Label Produzione" e i rect dentro Maschera_Produzione): stessi dati, ma in
      HTML dentro un <foreignObject>, come i pannelli impostazioni di silo-fill.
      Cosi' e' l'SVG a scalarlo e il pannello segue il sinottico quando si
      ridimensiona, senza JavaScript. Della finestra disegnata resta la cornice.

      Stessa tabella PARAMETRO / ATTUALE / NUOVO / OK dei pannelli di silo-fill e
      del popup SettingCasingComponent. Le quattro righe di sola lettura riempiono la
      colonna ATTUALE e lasciano vuote NUOVO e OK, cosi' i valori restano incolonnati
      sotto la stessa intestazione invece di spostarsi da una riga all'altra.

      Geometria (da rifare se si ridisegna la cornice rect1):
        rect1  = 136,395 x 107,396087 in x=334,00125 y=4,7450395
        scale  = (136,395 - 3) / 460          = 0,28998913
        height = (107,396087 - 3) / 0,28998913 = 360
      I 3 sono l'inset che tiene il pannello dentro il bordo (stroke 1,39593), e il
      translate del <g> e' l'angolo della cornice piu' meta' inset (1,5).
      26/08/2026: cornice spostata in alto e allungata da 75,063423 a 86,702324 per
      far posto alla riga del modo di taglio; le misure arrivano da SLICER_VIRGINIA.svg
      e valgono anche per la pagina Burley, il cui disegno non e' stato aggiornato.
      27/08/2026: allungata di nuovo, da 86,702324 a 107,396087, per le due righe del
      reset contatori e del registro pesate (il rect1-1 dell ombra segue la cornice: ha
      un transform che scala y di 1,1818645, per questo il suo height non e lo stesso).
      Sotto la cornice c e spazio libero fino a y=123 circa, dove comincia la linea dei
      nastri: se servissero altre righe, e di li che si prende lo spazio.


      Il setpoint di portata (V71 Virginia / V371 Burley) si digita nella colonna
      NUOVO e si conferma con OK, con log del parametro prima della scrittura; in
      ATTUALE resta il valore attivo sul PLC, che il disegno mostrava alla voce
      "SP portata oraria:" e che la versione precedente di questo pannello aveva
      perso sostituendolo con la sola casella di scrittura.
    -->
        <g transform="translate(335.50125,6.2450395) scale(0.28998913)">
          <foreignObject x="0"
                         y="0"
                         width="460"
                         height="360">
            <div xmlns="http://www.w3.org/1999/xhtml" class="slicer-settings-panel">
              <div class="section-title"><h5>PRODUZIONE</h5></div>
              <div class="table-responsive">
                <table class="table table-striped table-bordered card-table">
                  <thead>
                    <tr>
                      <th>PARAMETRO</th>
                      <th>ATTUALE</th>
                      <th>NUOVO</th>
                      <th>&nbsp;</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- V371: unico parametro scrivibile della finestra -->
                    <tr>
                      <td>SP portata oraria</td>
                      <td>{{slicer.FLOW_RATE_SETPOINT}} kg/h</td>
                      <td class="text-right">
                        <input type="number" class="form-control" [(ngModel)]="newFlowRateSetpoint" />
                      </td>
                      <td class="text-right">
                        <button class="btn btn-success" type="button" (click)="onFlowRateSetpointConfirm()">OK</button>
                      </td>
                    </tr>
                    <!-- Letture dal PLC: niente da impostare, NUOVO e OK restano vuote -->
                    <tr>
                      <td>Numero casse</td>
                      <td>{{slicer.BOX_COUNT}}</td>
                      <td></td>
                      <td></td>
                    </tr>
                    <tr>
                      <td>Peso medio casse</td>
                      <td>{{slicer.BOX_AVG_WEIGHT}} Kg</td>
                      <td></td>
                      <td></td>
                    </tr>
                    <tr>
                      <td>Flusso attuale</td>
                      <td>{{slicer.FLOW_RATE}} Kg/h</td>
                      <td></td>
                      <td></td>
                    </tr>
                    <tr>
                      <td>Numero tagli</td>
                      <td>{{slicer.CUT_COUNT}}</td>
                      <td></td>
                      <td></td>
                    </tr>
                    <!-- C1000: modo di taglio, lo stesso bit della pagina Parametri.
                         Lo switcher scrive subito, quindi occupa NUOVO e OK insieme
                         invece di lasciare una cella vuota accanto a un comando attivo. -->
                    <tr>
                      <td>Modo di taglio</td>
                      <td>
                        <span [ngClass]="{'badge': true,
                                          'badge-info': cutModeOn,
                                          'badge-secondary': !cutModeOn}">{{cutModeTxt}}</span>
                      </td>
                      <td class="text-center" colspan="2">
                        <label class="switcher switcher-info">
                          <input type="checkbox" class="switcher-input"
                                 [checked]="cutModeOn"
                                 (change)="onCutModeToggle($event.target.checked)" />
                          <span class="switcher-indicator">
                            <span class="switcher-yes"></span>
                            <span class="switcher-no"></span>
                          </span>
                        </label>
                      </td>
                    </tr>
                    <!-- V379 (totalizzatore) e V390 (numero casse): i due contatori di linea
                         che l'operatore azzera a inizio lotto. Il RESET li scrive a zero
                         insieme, dopo la conferma nella finestra swal, e occupano NUOVO
                         e OK: non c'e' un valore da digitare. In ATTUALE il totalizzatore,
                         che e' l'unico dei due a non avere gia' una riga sua. -->
                    <tr>
                      <td>Reset totalizzatore e numero casse</td>
                      <td>{{slicer.TOTALIZER}} Kg</td>
                      <td class="text-center" colspan="2">
                        <!-- Il RESET non scrive subito: chiede conferma con la stessa
                             finestra dei comandi globali della navbar (vedi
                             global-cmd-plate). L'azzeramento parte dal (confirm). -->
                        <button [swal]="{title:'Azzerare i contatori di linea?', text:'Totalizzatore e numero casse tornano a zero: i valori attuali non si recuperano!', icon:'warning', showCancelButton:true, confirmButtonText:'Sì, azzera!', cancelButtonText:'Annulla', showCloseButton:true, customClass: {confirmButton:'btn btn-lg btn-warning',cancelButton: 'btn btn-lg btn-default'}}"
                                (confirm)="onResetTotalizerAndBoxCount()"
                                class="btn btn-warning" type="button">RESET</button>
                      </td>
                    </tr>
                    <!-- Registro delle pesate casse: non e' un valore del PLC ma l'archivio
                         scritto da SlicerWeighingTask (tabella SlicerWeighings), quindi la
                         riga ha il solo pulsante che apre la maschera, filtrabile per data. -->
                    <tr>
                      <td>Registro pesate casse</td>
                      <td></td>
                      <td class="text-center" colspan="2">
                        <button class="btn btn-primary" type="button" (click)="openWeighingsDialog()">APRI</button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </foreignObject>
        </g>
