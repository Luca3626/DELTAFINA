<!--
  NOTA - IL BLOCCO "SPEED APRON CONVEYOR" LEGGE IL MOTORE F49

  Le scritte sotto "Speed Apron Conveyor" non sono generiche: sono lo stato e la velocita'
  di F49, che in MotorList e' descritto come Apron ed e' uno dei tre motori del Final Dryer
  con l'inverter (gli altri due sono F47 Belt e F70 Water Pump).

    text_lbl_apron_stop     -> Stop, visibile con !motorList.F49.RUNNING
    text_lbl_apron_running  -> Running, visibile con motorList.F49.RUNNING
    rect_apron_stop         -> il fondo scuro dietro Stop, stessa condizione
    text_lbl_apron_value    -> motorList.F49.VFD_ACTUAL_SPEED, cioe' VFD_F49_actVelPerc
                               (DB122.dbd760), una percentuale

  Nel blocco non c'e' il triangolo di warning: non serve, il bypass di F49 si vede dal
  warning g_warning_F49 accanto al motore.

  VELOCITA' DI F49 MOSTRATA IN DUE PUNTI

  Lo stesso numero compare anche nel riquadro RECT_VISUALIZZAZIONE_MOTORE_F49 /
  LBL_VISUALIZZAZIONE_MOTORE_F49, accanto al motore. E' voluto: il blocco a sinistra e' la
  lettura di impianto, il riquadro e' la lettura del motore dove il motore e' disegnato. Se
  in reparto la doppia indicazione risulta di troppo, basta commentare uno dei due gruppi:
  sono indipendenti, non condividono niente oltre al motore letto.

  Sul burley dryer vale la stessa cosa con B54 al posto di F49.
-->
<h4 class="font-weight-bold py-3 mb-4 dryer-title" style="padding-top: 0px !important; ">
  <span class="dryer-title-left">
    <span class="title-icon-box">
      <img src="assets/svg/svg-icon/dryer-icon.svg" alt="Final Dryer" />
    </span>
    <span class="dryer-title-text">Final Dryer</span>

    <!-- Comandi di zona (DB120 - FROM_HMI) raccolti sotto un pulsante: la testata resta
         pulita e i comandi restano a un click. Il pannello e' in posizione assoluta
         rispetto a .zone-cmd, quindi non allarga la testata, e resta aperto finche' non
         si ripreme il pulsante, cosi' si possono dare due comandi di fila (es. AUTO e
         poi START). Mode 0=man / 1=AUT, State 0=stop / 1=start. -->
    <span class="zone-cmd">
      <button type="button" class="btn btn-primary btn-sm zone-cmd-toggle" (click)="cmdOpen = !cmdOpen">
        <i class="fas fa-sliders-h"></i> Comandi
        <i class="fas" [ngClass]="cmdOpen ? 'fa-caret-up' : 'fa-caret-down'"></i>
      </button>
      <!-- Il feedback sta accanto ai pulsanti che lo comandano: il modo operativo a
           destra di MAN/AUTO, lo stato a destra di STOP/START. Prima erano due badge
           in testata, fuori dal menu. -->
      <div class="zone-cmd-panel" *ngIf="cmdOpen">
        <span class="dryer-cmd-group">
          <span class="dryer-cmd-label">Modalità Operativa</span>
          <button (click)="onZoneMode(TagList.FROM_HMI_Zn_3_3_Mode_mn_AUT, 'Zona 3.3', false)" [ngClass]="!TagList.FROM_HMI_Zn_3_3_Mode_mn_AUT.value ? 'btn btn-primary' : 'btn btn-default'" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;margin-right:4px;vertical-align:middle;">MAN</button>
          <button (click)="onZoneMode(TagList.FROM_HMI_Zn_3_3_Mode_mn_AUT, 'Zona 3.3', true)" [ngClass]="TagList.FROM_HMI_Zn_3_3_Mode_mn_AUT.value ? 'btn btn-primary' : 'btn btn-default'" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;vertical-align:middle;">AUTO</button>
          <span class="zone-cmd-badge">
            <span *ngIf="TagList.FROM_HMI_Zn_3_3_Mode_mn_AUT.value" class="badge badge-primary" style="font-size:12px;vertical-align:middle;">AUTOMATICO</span>
            <span *ngIf="!TagList.FROM_HMI_Zn_3_3_Mode_mn_AUT.value" class="badge badge-warning" style="font-size:12px;vertical-align:middle;">MANUALE</span>
          </span>
        </span>
        <span class="dryer-cmd-group">
          <span class="dryer-cmd-label">Stato di zona</span>
          <button (click)="onZoneState(TagList.FROM_HMI_Zn_3_3_State_off_ON, 'Zona 3.3', false)" class="btn btn-danger" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;margin-right:4px;vertical-align:middle;"><i class="fas fa-square"></i> STOP</button>
          <button (click)="onZoneState(TagList.FROM_HMI_Zn_3_3_State_off_ON, 'Zona 3.3', true)" class="btn btn-success" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;vertical-align:middle;"><i class="fas fa-play"></i> START</button>
          <span class="zone-cmd-badge">
            <span *ngIf="TagList.FROM_HMI_Zn_3_3_State_off_ON.value" class="badge badge-success" style="font-size:12px;vertical-align:middle;">IN MARCIA</span>
            <span *ngIf="!TagList.FROM_HMI_Zn_3_3_State_off_ON.value" class="badge badge-secondary" style="font-size:12px;vertical-align:middle;">FERMA</span>
          </span>
        </span>
      </div>
    </span>

  </span>

  <!-- Feedback di zona (DB121 - TO_HMI): il PLC alza All_ON quando tutte le utenze
       della zona sono in marcia. Sta al centro della testata, fra titolo e allarmi. -->
  <span class="dryer-title-center">
    <span *ngIf="allOn()" class="badge badge-success" style="font-size:12px;vertical-align:middle;">TUTTE LE UTENZE IN MARCIA</span>
  </span>

  <!-- Colonna di destra: gli allarmi di zona e, in fondo a destra, lo switcher. -->
  <span class="dryer-title-right">
    <!-- Allarmi cumulativi di zona (DB121 - TO_HMI): compaiono solo quando il PLC li
         segnala. MOL_nok = scatto termico cumulativo della zona, DAC_ok a 0 = almeno
         un sezionatore aperto, mCC*_SS_ok a 0 = quadro MCC senza tensione.
         Lampeggiano, come il riquadro sulla dashboard. -->
    <span *ngIf="molAlarm()" class="badge badge-danger zona-allarme-badge" style="font-size:12px;vertical-align:middle;margin-right:6px;">SCATTO TERMICO</span>
    <span *ngIf="dacAlarm()" class="badge badge-danger zona-allarme-badge" style="font-size:12px;vertical-align:middle;margin-right:6px;">SEZIONATORE APERTO</span>
    <span *ngIf="mccAlarm()" class="badge badge-danger zona-allarme-badge" style="font-size:12px;vertical-align:middle;margin-right:6px;">MCC SENZA TENSIONE</span>
    <label class="switcher">
      <input type="checkbox" class="switcher-input" [(ngModel)]="showName">
      <span class="switcher-indicator">
        <span class="switcher-yes"></span>
        <span class="switcher-no"></span>
      </span>
      <span class="switcher-label">Mostra Nomi</span>
    </label>
  </span>
</h4>
