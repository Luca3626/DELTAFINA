<h4 class="font-weight-bold py-3 mb-4 zona-title" style="padding-top: 0px !important; border-bottom: 2px solid #696b6e;">
  <span class="zona-title-left">
    <span class="zona-title-text">Zona 3.4 - Final Metal Detector</span>

    <!-- Comandi di zona (DB120 - FROM_HMI) raccolti sotto un pulsante: la testata resta
         pulita e i comandi restano a un click. Il pannello e' in posizione assoluta
         rispetto a .zone-cmd, quindi non allarga la testata, e resta aperto finche' non
         si ripreme il pulsante, cosi' si possono dare due comandi di fila (es. AUTO e
         poi START). Mode 0=man / 1=AUT, State 0=stop / 1=start. -->
    <span class="zone-cmd">
      <button type="button" class="btn btn-primary btn-sm zone-cmd-toggle" (click)="cmdOpen = !cmdOpen">
        <i class="fas fa-sliders-h"></i> Comandi
        <i class="fas" [ngClass]="cmdOpen ? 'fa-caret-up' : 'fa-caret-down'"></i>
      </button>
      <!-- Il feedback sta accanto ai pulsanti che lo comandano: il modo operativo a
           destra di MAN/AUTO, lo stato a destra di STOP/START. Prima erano due badge
           in testata, fuori dal menu. -->
      <div class="zone-cmd-panel" *ngIf="cmdOpen">
        <span class="zona-cmd-group">
          <span class="zona-cmd-label">Modalità Operativa</span>
          <button (click)="onZoneMode(TagList.FROM_HMI_Zn_3_4_Mode_mn_AUT, 'Zona 3.4', false)" [ngClass]="!TagList.FROM_HMI_Zn_3_4_Mode_mn_AUT.value ? 'btn btn-primary' : 'btn btn-default'" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;margin-right:4px;vertical-align:middle;">MAN</button>
          <button (click)="onZoneMode(TagList.FROM_HMI_Zn_3_4_Mode_mn_AUT, 'Zona 3.4', true)" [ngClass]="TagList.FROM_HMI_Zn_3_4_Mode_mn_AUT.value ? 'btn btn-primary' : 'btn btn-default'" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;vertical-align:middle;">AUTO</button>
          <span class="zone-cmd-badge">
            <span *ngIf="TagList.FROM_HMI_Zn_3_4_Mode_mn_AUT.value" class="badge badge-primary" style="font-size:12px;vertical-align:middle;">AUTOMATICO</span>
            <span *ngIf="!TagList.FROM_HMI_Zn_3_4_Mode_mn_AUT.value" class="badge badge-warning" style="font-size:12px;vertical-align:middle;">MANUALE</span>
          </span>
        </span>
        <span class="zona-cmd-group">
          <span class="zona-cmd-label">Stato di zona</span>
          <button (click)="onZoneState(TagList.FROM_HMI_Zn_3_4_State_off_ON, 'Zona 3.4', false)" class="btn btn-danger" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;margin-right:4px;vertical-align:middle;"><i class="fas fa-square"></i> STOP</button>
          <button (click)="onZoneState(TagList.FROM_HMI_Zn_3_4_State_off_ON, 'Zona 3.4', true)" class="btn btn-success" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;vertical-align:middle;"><i class="fas fa-play"></i> START</button>
          <span class="zone-cmd-badge">
            <span *ngIf="TagList.FROM_HMI_Zn_3_4_State_off_ON.value" class="badge badge-success" style="font-size:12px;vertical-align:middle;">IN MARCIA</span>
            <span *ngIf="!TagList.FROM_HMI_Zn_3_4_State_off_ON.value" class="badge badge-secondary" style="font-size:12px;vertical-align:middle;">FERMA</span>
          </span>
        </span>
      </div>
    </span>

  </span>

  <!-- Feedback di zona (DB121 - TO_HMI): il PLC alza All_ON quando tutte le utenze
       della zona sono in marcia. Sta al centro della testata, fra titolo e allarmi. -->
  <span class="zona-title-center">
    <span *ngIf="allOn()" class="badge badge-success" style="font-size:12px;vertical-align:middle;">TUTTE LE UTENZE IN MARCIA</span>
  </span>

  <!-- Colonna di destra: gli allarmi di zona e, in fondo a destra, lo switcher. -->
  <span class="zona-title-right">
    <!-- Allarmi cumulativi di zona (DB121 - TO_HMI): compaiono solo quando il PLC li
         segnala. MOL_nok = scatto termico cumulativo della zona, DAC_ok a 0 = almeno
         un sezionatore aperto. Lampeggiano, come il riquadro sulla dashboard. -->
    <span *ngIf="molAlarm()" class="badge badge-danger zona-allarme-badge" style="font-size:12px;vertical-align:middle;margin-right:6px;">SCATTO TERMICO</span>
    <span *ngIf="dacAlarm()" class="badge badge-danger zona-allarme-badge" style="font-size:12px;vertical-align:middle;margin-right:6px;">SEZIONATORE APERTO</span>
    <label class="switcher">
      <input type="checkbox" class="switcher-input" [(ngModel)]="showName">
      <span class="switcher-indicator">
        <span class="switcher-yes"></span>
        <span class="switcher-no"></span>
      </span>
      <span class="switcher-label">Mostra Nomi</span>
    </label>
  </span>
</h4>
