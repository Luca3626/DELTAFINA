  <button type="button" class="btn btn-primary rounded-pill d-block" (click)="onBnNewClick()"><span class="ion ion-md-add"></span>&nbsp; Crea Nuovo Utente</button>
</h4>

<!-- / Filters -->
<div class="card">
<!-- Table controls -->
<div class="card-body">
  <div class="row">
    <div class="col">
      Per page: &nbsp;
      <select [(ngModel)]="perPage"
              (change)="update()"
              class="custom-select custom-select-sm d-inline-block w-auto">
        <option *ngFor="let limit of [10, 20, 30, 40, 50]">{{limit}}</option>
      </select>
    </div>
    <div class="col">
      <div class="pull-right text-muted"><em class="icon-wallet mr-sm"></em><strong>{{totalItems}}</strong> utenti</div>
      <!--<input type="text"
             [(ngModel)]="filterVal"
             (input)="currentPage = 1; update()"
             class="form-control form-control-sm d-inline-block w-auto float-sm-right"
             placeholder="Search...">-->
    </div>
  </div>
</div>
<!-- / Table controls -->
<!-- Table -->
<hr class="border-light m-0">
<div class="table-responsive">
  <table class="table table-striped table-bordered card-table">
    <thead>
      <tr>
        <th class="text-nowrap cursor-pointer" (click)="setSort('userName')">
          Nome Utente<i class="ion text-muted ml-2" *ngIf="sortBy=='userName'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
        </th>
        <th class="text-nowrap cursor-pointer" (click)="setSort('email')">
          Email<i class="ion text-muted ml-2" *ngIf="sortBy=='email'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
        </th>
        <th class="text-nowrap cursor-pointer" (click)="setSort('fullName')">
          Nome<i class="ion text-muted ml-2" *ngIf="sortBy=='fullName'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
        </th>
        <th class="text-nowrap cursor-pointer" (click)="setSort('userType')">
          Tipo<i class="ion text-muted ml-2" *ngIf="sortBy=='userType'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
        </th>
        <th class="text-nowrap cursor-pointer">
          Telefono
        </th>
        <th class="text-nowrap cursor-pointer">
          Mobile
        </th>
        <th class="text-nowrap cursor-pointer" (click)="setSort('city')">
          Comune<i class="ion text-muted ml-2" *ngIf="sortBy=='city'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
        </th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>
          <input class="form-control" type="text" (keyup)="onKey($event)" id="fUserName" name="fUserName" [(ngModel)]="filterService.userFilters.userName" placeholder="Filtra per account">
        </td>
        <td>
          <input class="form-control" type="text" (keyup)="onKey($event)" id="fEmail" name="fEmail" [(ngModel)]="filterService.userFilters.email" placeholder="Filtra per email">
        </td>
        <td>
          <input class="form-control" type="text" (keyup)="onKey($event)" id="fFullName" name="fFullName" [(ngModel)]="filterService.userFilters.fullName" placeholder="Filtra per nome">
        </td>
        <td>
          <input class="form-control" type="text" (keyup)="onKey($event)" id="fUserType" name="fUserType" [(ngModel)]="filterService.userFilters.userType" placeholder="Filtra per tipo">
        </td>
        <td>
          <input class="form-control" type="text" (keyup)="onKey($event)" id="fPhone" name="fPhone" [(ngModel)]="filterService.userFilters.phone" placeholder="Filtra per fisso">
        </td>
        <td>
          <input class="form-control" type="text" (keyup)="onKey($event)" id="fMobile" name="fMobile" [(ngModel)]="filterService.userFilters.mobile" placeholder="Filtra per cellulare">
        </td>
        <td>
          <input class="form-control" type="text" (keyup)="onKey($event)" id="fCity" name="fCity" [(ngModel)]="filterService.userFilters.city" placeholder="Filtra per comune">
        </td>
        <td class="text-center text-nowrap align-middle">
          <a href="javascript:void(0)" class="btn btn-default btn-xs icon-btn md-btn-flat" ngbTooltip="Rimuovi Filtri"><i class="ion ion-md-close" (click)="removeFilters()"></i></a>
        </td>
      </tr>
      <tr *ngFor="let user of usersData">
        <td class="align-middle"><a href="javascript:void(0)" (click)="open(user)">{{user.userName}}</a></td>
        <td class="align-middle">{{user.email}}</td>
        <td class="align-middle">{{user.fullName}}</td>
        <td class="align-middle">{{user.userType}}</td>
        <td class="align-middle">{{user.phone}}</td>
        <td class="align-middle">{{user.mobile}}</td>
        <td class="align-middle">{{user.city}}</td>
        <td class="text-center text-nowrap align-middle">
          <a href="javascript:void(0)" (click)="open(user)" class="btn btn-default btn-xs icon-btn md-btn-flat" ngbTooltip="Edit">
            <i class="ion ion-md-create"></i>
          </a>
        </td>

          <!--<td class="align-middle">
      <span class="ion" [ngClass]="{'ion-md-checkmark text-primary': user.verified, 'ion-md-close text-light': !user.verified}"></span>
    </td>-->
          <!--<td class="align-middle">
      <span *ngIf="user.role === 1">User</span>
      <span *ngIf="user.role === 2">Author</span>
      <span *ngIf="user.role === 3">Staff</span>
      <span *ngIf="user.role === 4">Admin</span>
    </td>
    <td class="align-middle">
      <span class="badge badge-outline-success" *ngIf="user.status === 1">Active</span>
      <span class="badge badge-outline-danger" *ngIf="user.status === 2">Banned</span>
      <span class="badge badge-outline-default" *ngIf="user.status === 3">Deleted</span>
    </td>
    <td class="text-center text-nowrap align-middle">
      <a href="javascript:void(0)" class="btn btn-default btn-xs icon-btn md-btn-flat" ngbTooltip="Edit">
        <i class="ion ion-md-create"></i>
      </a>-->
          <!--<div class="btn-group" ngbDropdown [placement]="!isRTL ? 'bottom-right' : 'bottom-left'">
      <button type="button" class="btn btn-default btn-xs icon-btn md-btn-flat hide-arrow" ngbDropdownToggle ngbTooltip="Actions">
        <i class="ion ion-ios-settings"></i>
      </button>
      <div ngbDropdownMenu [class.dropdown-menu-right]="!isRTL">
        <a class="dropdown-item" href="javascript:void(0)">View profile</a>
        <a class="dropdown-item" href="javascript:void(0)">Ban user</a>
        <a class="dropdown-item" href="javascript:void(0)">Remove</a>
      </div>
    </div>-->
          <!--</td>-->

      </tr>
    </tbody>
  </table>
</div>
<!-- / Table -->
<!-- Pagination -->
<div class="card-body py-0">
  <div class="row">
    <div class="col-sm text-sm-left text-center pt-3">
      <span class="text-muted" *ngIf="totalItems">Page {{ currentPage }} of {{ totalPages }}</span>
    </div>
    <div class="col-sm pt-3">
      <ngb-pagination [collectionSize]="totalItems"
                      [pageSize]="perPage"
                      [(page)]="currentPage"
                      (pageChange)="update()"
                      size="sm"
                      class="d-flex justify-content-center justify-content-sm-end m-0"></ngb-pagination>
    </div>
  </div>
</div>
<!-- / Pagination -->
</div>
