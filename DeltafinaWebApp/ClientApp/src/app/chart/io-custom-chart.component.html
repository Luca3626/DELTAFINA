<div class="io-custom-chart-page">

  <!-- Loading -->
  <div *ngIf="isLoading" class="text-center py-5">
    <i class="fas fa-spinner fa-spin fa-2x" style="color:#7f8cf1"></i>
    <p class="mt-2 text-muted">Caricamento segnali...</p>
  </div>

  <!-- UNA SOLA CARD con Storico + Live dentro -->
  <div class="ec-card" *ngIf="!isLoading">
    <h5 class="ec-header">
      <i class="fas fa-chart-line"></i>&nbsp; Personalizza Grafico Segnali I/O
    </h5>
    <div class="ec-body">
      <div class="io-charts-2col">

        <!-- Colonna sinistra: Storici -->
        <div class="io-charts-col">
          <div class="io-charts-col-header"><i class="fas fa-history"></i> Storici</div>
          <io-custom-historical-chart
            [deviceName]="'ALL'"
            [deviceAlias]="'Tutti i dispositivi'"
            [analogTags]="allAnalogTags"
            [ioDescriptions]="ioDescriptions"
            [ioSignalTypes]="ioSignalTypes"
            [lockedTagNames]="lockedTagNames">
          </io-custom-historical-chart>
        </div>

        <!-- Colonna destra: Live -->
        <div class="io-charts-col">
          <div class="io-charts-col-header"><i class="fas fa-wave-square"></i> Live</div>
          <div *ngIf="analogTags.length === 0" class="alert alert-info py-2 mt-2 mx-2">
            <i class="fas fa-info-circle mr-1"></i>
            <small>Nessun segnale live disponibile. Configura la normalizzazione per visualizzare i dati in tempo reale.</small>
          </div>
          <io-custom-live-chart *ngIf="analogTags.length > 0"
            [deviceName]="'ALL'"
            [analogTags]="analogTags"
            [userUnitsVersion]="userUnitsVersion"
            [ioDescriptions]="ioDescriptions"
            [ioSignalTypes]="ioSignalTypes"
            [lockedTagNames]="lockedTagNames">
          </io-custom-live-chart>
        </div>

      </div>
    </div>
  </div>

</div>
