<div class="chart-panel">
  <div class="chart-panel__signals" *ngIf="!isLocked">
    <div class="io-signal-list">
      <div class="io-signal-row" *ngFor="let sig of selectedSignals; let i = index">
        <span class="io-sig-dot" [style.background]="sig.color"></span>
        <ng-select class="io-sig-ng-select"
                   [items]="signalOptions"
                   bindLabel="label"
                   bindValue="value"
                   [(ngModel)]="sig.tagName"
                   (ngModelChange)="onSignalChange(i, $event)"
                   [searchable]="true"
                   [clearable]="false"
                   [placeholder]="sig.tagName ? '' : 'Cerca segnale...'"
                   appendTo="body">
          <ng-template ng-label-tmp let-item="item">
            <span>{{ item.label }}</span>
            <span *ngIf="getTypeLabel(item.value)" style="margin-left:8px; font-size:0.62rem; font-weight:700" [style.color]="getTypeColor(item.value)">{{ getTypeLabel(item.value) }}</span>
          </ng-template>
          <ng-template ng-option-tmp let-item="item">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; line-height:1.25; padding:2px 0">
              <span style="flex:1 1 auto; white-space:normal">{{ item.label }}</span>
              <span style="flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; text-align:right">
                <span class="io-sig-type" style="font-size:0.62rem; font-weight:700" [style.color]="getTypeColor(item.value)">{{ getTypeLabel(item.value) }}</span>
                <span class="io-sig-tag-code" style="font-size:0.65rem; color:#9aa5b1">{{ item.value }}</span>
              </span>
            </div>
          </ng-template>
        </ng-select>
        <span class="io-sig-unit" *ngIf="sig.tagName">{{ getUnitForTag(sig.tagName) }}</span>
        <button class="io-sig-remove" (click)="removeSignal(i)" title="Rimuovi"><i class="fas fa-times"></i></button>
      </div>
      <button class="io-sig-add" (click)="addSignal()" *ngIf="canAddSignal()"><i class="fas fa-plus"></i> Aggiungi segnale</button>
    </div>
  </div>
  <div class="chart-panel__toolbar" [class.is-disabled]="!hasValidSignal">
    <div class="ec-filters">
      <div class="btn-group btn-group-toggle" ngbRadioGroup name="displayRange" [(ngModel)]="displayRangeModel">
        <label ngbButtonLabel class="btn btn-default">
          <input ngbButton type="radio" [value]="0" (change)="changeRange(0)" [disabled]="!hasValidSignal"> Oggi
        </label>
        <label ngbButtonLabel class="btn btn-default">
          <input ngbButton type="radio" [value]="1" (change)="changeRange(1)" [disabled]="!hasValidSignal"> Ieri
        </label>
        <label ngbButtonLabel class="btn btn-default">
          <input ngbButton type="radio" [value]="48" (change)="changeRange(48)" [disabled]="!hasValidSignal"> Giorno
        </label>
      </div>
    </div>
    <input type="date" class="io-date-input" [disabled]="!hasValidSignal || displayRangeModel !== 48" [value]="diagDateForInput" (change)="onDateInputChange($event)" />
    <button class="io-btn-icon" (click)="exportCSV()" [disabled]="!hasValidSignal || !hasAnyData"
            ngbTooltip="Esporta i dati storici in CSV"
            container="body"><i class="fas fa-file-export"></i></button>
    <div class="io-warning" *ngIf="errorMessage"><i class="fas fa-exclamation-triangle"></i> {{ errorMessage }}</div>
  </div>
  <div class="chart-panel__canvas">
    <div class="io-chart-wrap" *ngIf="hasValidSignal">
      <canvas baseChart [datasets]="chartData.datasets" [labels]="chartData.labels" [options]="chartOptions" [chartType]="lineChartType"></canvas>
      <div class="io-no-history" *ngIf="!hasAnyData">
        <i class="fas fa-info-circle"></i> Nessun dato storico per il periodo selezionato
      </div>
    </div>
    <div class="io-empty" *ngIf="!hasValidSignal"><i class="fas fa-chart-line"></i> Seleziona almeno un segnale</div>
  </div>
</div>
