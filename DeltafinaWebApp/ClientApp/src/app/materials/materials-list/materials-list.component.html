<h4 class="d-flex justify-content-between align-items-center w-100 font-weight-bold py-3 mb-4">
  Materiali
  <button type="button" class="btn btn-primary rounded-pill d-block" (click)="onBnNewClick()"><span class="ion ion-md-add"></span>&nbsp; Inserisci Materiale</button>
</h4>
<!-- / Filters -->
<div class="card">
<!-- Table controls -->
<div class="card-body">
  <div class="row">
    <div class="col">
      Per page: &nbsp;
      <select [(ngModel)]="perPage"
              (change)="update()"
              class="custom-select custom-select-sm d-inline-block w-auto">
        <option *ngFor="let limit of [10, 20, 30, 40, 50]">{{limit}}</option>
      </select>
    </div>
    <div class="col">
      <div class="pull-right text-muted"><em class="icon-wallet mr-sm"></em><strong>{{totalItems}}</strong> materiali</div>
      <!--<input type="text"
             [(ngModel)]="filterVal"
             (input)="currentPage = 1; update()"
             class="form-control form-control-sm d-inline-block w-auto float-sm-right"
             placeholder="Search...">-->
    </div>
  </div>
</div>
<!-- / Table controls -->
<!-- Table -->
<hr class="border-light m-0">
<div class="table-responsive">
  <table class="table table-striped table-bordered card-table">
    <thead>
      <tr>
        <!--<th class="text-nowrap cursor-pointer" (click)="setSort('code')">
          Silo<i class="ion text-muted ml-2" *ngIf="sortBy=='code'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
        </th>-->
        <th class="text-nowrap cursor-pointer" (click)="setSort('code')">
          Codice<i class="ion text-muted ml-2" *ngIf="sortBy=='code'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
        </th>
        <th class="text-nowrap cursor-pointer" (click)="setSort('name')">
          Nome<i class="ion text-muted ml-2" *ngIf="sortBy=='name'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
        </th>
        <!--<th class="text-nowrap cursor-pointer" (click)="setSort('vat')">
          Partita IVA<i class="ion text-muted ml-2" *ngIf="sortBy=='vat'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
        </th>
        <th class="text-nowrap cursor-pointer" (click)="setSort('email')">
          Email<i class="ion text-muted ml-2" *ngIf="sortBy=='email'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
        </th>
        <th class="text-nowrap cursor-pointer">
          Telefono
        </th>
        <th class="text-nowrap cursor-pointer">
          Mobile
        </th>
        <th class="text-nowrap cursor-pointer" (click)="setSort('city')">
          Comune<i class="ion text-muted ml-2" *ngIf="sortBy=='city'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
        </th>-->
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>
          <input class="form-control" type="text" (keyup)="onKey($event)" id="fCode" name="fCode" [(ngModel)]="filterService.materialFilters.code" placeholder="Filtra per codice">
        </td>
        <td>
          <input class="form-control" type="text" (keyup)="onKey($event)" id="fName" name="fName" [(ngModel)]="filterService.materialFilters.name" placeholder="Filtra per nome">
        </td>
        <td class="text-center text-nowrap align-middle">
          <a href="javascript:void(0)" class="btn btn-default btn-xs icon-btn md-btn-flat" ngbTooltip="Rimuovi Filtri"><i class="ion ion-md-close" (click)="removeFilters()"></i></a>
        </td>
      </tr>
      <tr *ngFor="let material of materialsData">
        <td class="align-middle">{{material.code}}</td>
        <td class="align-middle"><a href="javascript:void(0)" (click)="open(material)">{{material.name}}</a></td>
        <td class="text-center text-nowrap align-middle">
          <a href="javascript:void(0)" (click)="open(material)" class="btn btn-default btn-xs icon-btn md-btn-flat" ngbTooltip="Edit">
            <i class="ion ion-md-create"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<!-- / Table -->
<!-- Pagination -->
<div class="card-body py-0">
  <div class="row">
    <div class="col-sm text-sm-left text-center pt-3">
      <span class="text-muted" *ngIf="totalItems">Page {{ currentPage }} of {{ totalPages }}</span>
    </div>
    <div class="col-sm pt-3">
      <ngb-pagination [collectionSize]="totalItems"
                      [pageSize]="perPage"
                      [(page)]="currentPage"
                      (pageChange)="update()"
                      size="sm"
                      class="d-flex justify-content-center justify-content-sm-end m-0"></ngb-pagination>
    </div>
  </div>
</div>
<!-- / Pagination -->
</div>
