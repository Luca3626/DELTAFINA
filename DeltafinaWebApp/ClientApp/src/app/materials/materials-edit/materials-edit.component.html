<form name="form" #f="ngForm" (ngSubmit)="f.form.valid && onSubmit()" appIdentityRevealed>
  <div class="card mb-4">
    <h6 class="card-header">
      Dati Generali
    </h6>
    <div class="card-body">
      <div class="form-group">
        <label class="form-label form-label-lg">Codice</label>
        <input id="code" name="code" username="code" class="form-control form-control-lg" [ngClass]="code.invalid && (code.dirty || code.touched) && code.errors ? 'is-invalid' : ''" [(ngModel)]="materialData.code" #code="ngModel" required>
        <small *ngIf="code && code.invalid && (code.dirty || code.touched) && code.errors.required" class="invalid-feedback">Il codice è un campo obbligatorio.</small>
      </div>
      <div class="form-group">
        <label class="form-label">Nome</label>
        <input id="name" name="name" username="name" class="form-control form-control-lg" [ngClass]="name.invalid && (name.dirty || name.touched) && name.errors ? 'is-invalid' : ''" [(ngModel)]="materialData.name" #name="ngModel" required>
        <small *ngIf="name && name.invalid && (name.dirty || name.touched) && name.errors.required" class="invalid-feedback">Il nome è un campo obbligatorio.</small>
      </div>
      <div class="form-group">
        <label class="form-label">Unità di misura</label>
        <input id="unityOfMeasure" name="unityOfMeasure" username="unityOfMeasure" class="form-control form-control-lg" [ngClass]="unityOfMeasure.invalid && (unityOfMeasure.dirty || unityOfMeasure.touched) && unityOfMeasure.errors ? 'is-invalid' : ''" [(ngModel)]="materialData.unityOfMeasure" #unityOfMeasure="ngModel" required>
        <small *ngIf="unityOfMeasure && unityOfMeasure.invalid && (unityOfMeasure.dirty || unityOfMeasure.touched) && unityOfMeasure.errors.required" class="invalid-feedback">L'unità di misura è un campo obbligatorio.</small>
      </div>
    </div>
  </div>
  <div class="text-right mt-3">
    <button type="submit" [disabled]="f.invalid" class="btn btn-primary">Salva</button>&nbsp;
    <button type="button" class="btn btn-default" (click)="goToList()">Chiudi</button>
  </div>
</form>
