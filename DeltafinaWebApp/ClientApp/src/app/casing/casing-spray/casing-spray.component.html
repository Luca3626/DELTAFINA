<!--
  TITOLO A TRE COLONNE

  Stessa impostazione delle pagine Slicer e Silos: a sinistra icona + nome pagina, in
  mezzo i comandi di zona, a destra il badge di stato e, in fondo, lo switcher
  "Mostra Nomi". Le due colonne laterali hanno la stessa larghezza (flex:1), cosi' il
  blocco dei pulsanti resta centrato rispetto a tutta la riga del titolo e non solo
  allo spazio che avanza a destra.
-->
<h4 class="font-weight-bold py-3 mb-4 casing-title" style="padding-top: 0px !important; ">
  <span class="casing-title-left">
    <span class="title-icon-box">
      <img src="assets/svg/svg-icon/casing-spray-icon.svg" alt="Casing Spray" />
    </span>
    <span class="casing-title-text">Casing Spray</span>

    <!-- Comandi di zona (DB120 - FROM_HMI) raccolti sotto un pulsante: la testata resta
         pulita e i comandi restano a un click. Il pannello e' in posizione assoluta
         rispetto a .zone-cmd, quindi non allarga la testata, e resta aperto finche' non
         si ripreme il pulsante, cosi' si possono dare due comandi di fila (es. AUTO e
         poi START). Mode 0=man / 1=AUT, State 0=stop / 1=start.
         Zona 2.0 = Casing Room: e' la stessa zona della pagina Casing Tanks. -->
    <span class="zone-cmd">
      <button type="button" class="btn btn-primary btn-sm zone-cmd-toggle" (click)="cmdOpen = !cmdOpen">
        <i class="fas fa-sliders-h"></i> Comandi
        <i class="fas" [ngClass]="cmdOpen ? 'fa-caret-up' : 'fa-caret-down'"></i>
      </button>
      <!-- Il feedback sta accanto ai pulsanti che lo comandano: il modo operativo a
           destra di MAN/AUTO, lo stato a destra di STOP/START. Prima erano due badge
           in testata, fuori dal menu. -->
      <div class="zone-cmd-panel" *ngIf="cmdOpen">
        <span class="casing-cmd-group">
          <span class="casing-cmd-label">Modalità Operativa</span>
          <button (click)="onZoneMode(TagList.FROM_HMI_Zn_2_0_Mode_mn_AUT, 'Zona 2.0', false)" [ngClass]="!TagList.FROM_HMI_Zn_2_0_Mode_mn_AUT.value ? 'btn btn-primary' : 'btn btn-default'" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;margin-right:4px;vertical-align:middle;">MAN</button>
          <button (click)="onZoneMode(TagList.FROM_HMI_Zn_2_0_Mode_mn_AUT, 'Zona 2.0', true)" [ngClass]="TagList.FROM_HMI_Zn_2_0_Mode_mn_AUT.value ? 'btn btn-primary' : 'btn btn-default'" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;vertical-align:middle;">AUTO</button>
          <span class="zone-cmd-badge">
            <span *ngIf="TagList.FROM_HMI_Zn_2_0_Mode_mn_AUT.value" class="badge badge-primary" style="font-size:12px;vertical-align:middle;">AUTOMATICO</span>
            <span *ngIf="!TagList.FROM_HMI_Zn_2_0_Mode_mn_AUT.value" class="badge badge-warning" style="font-size:12px;vertical-align:middle;">MANUALE</span>
          </span>
        </span>
        <span class="casing-cmd-group">
          <span class="casing-cmd-label">Stato di zona</span>
          <button (click)="onZoneState(TagList.FROM_HMI_Zn_2_0_State_off_ON, 'Zona 2.0', false)" class="btn btn-danger" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;margin-right:4px;vertical-align:middle;"><i class="fas fa-square"></i> STOP</button>
          <button (click)="onZoneState(TagList.FROM_HMI_Zn_2_0_State_off_ON, 'Zona 2.0', true)" class="btn btn-success" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;vertical-align:middle;"><i class="fas fa-play"></i> START</button>
          <span class="zone-cmd-badge">
            <span *ngIf="TagList.FROM_HMI_Zn_2_0_State_off_ON.value" class="badge badge-success" style="font-size:12px;vertical-align:middle;">IN MARCIA</span>
            <span *ngIf="!TagList.FROM_HMI_Zn_2_0_State_off_ON.value" class="badge badge-secondary" style="font-size:12px;vertical-align:middle;">FERMA</span>
          </span>
        </span>
      </div>
    </span>

  </span>

  <!-- La zona 2.0 (Casing Room) non ha il bit All_ON sul DB121: qui non c'e' niente
       da mostrare al centro, la colonna resta per tenere gli allarmi a destra. -->
  <span class="casing-title-center"></span>

  <!-- Colonna di destra: gli allarmi di zona e, in fondo a destra, lo switcher. -->
  <span class="casing-title-right">
    <!-- Della zona 2.0 (Casing Room) il DB121 pubblica il DAC_ok e la tensione del
         quadro MCC Casing (mCCc_SS_ok, a 0 = allarme): il cumulativo degli scatti
         termici invece non esiste. -->
    <span *ngIf="dacAlarm()" class="badge badge-danger zona-allarme-badge" style="font-size:12px;vertical-align:middle;margin-right:6px;">SEZIONATORE APERTO</span>
    <span *ngIf="mccAlarm()" class="badge badge-danger zona-allarme-badge" style="font-size:12px;vertical-align:middle;margin-right:6px;">MCC SENZA TENSIONE</span>
    <label class="switcher">
      <input type="checkbox" class="switcher-input" [(ngModel)]="showName">
      <span class="switcher-indicator">
        <span class="switcher-yes"></span>
        <span class="switcher-no"></span>
      </span>
      <span class="switcher-label">Mostra Nomi</span>
    </label>
  </span>
</h4>

            (click)="openPidDialog('BTFP_VSD', $event)">
      PID
    </button>

    <!-- BOTTONE IMPOSTAZIONI DI PAGINA
         Come i bottoni PID e' un pulsante HTML sovrapposto al disegno: ricalca la
         cornice blu RECT_SETTINGS in fondo al sinottico, quella con accanto la
         scritta "Impostazioni dosaggio". La posizione e' in percentuale del
         viewBox, la dimensione e' fissa (34 px, la stessa di Casing Tanks) cosi'
         l'icona resta leggibile a ogni larghezza. Apre lo stesso popup settingCasing
         della pagina Casing Tanks. -->
    <button type="button"
            class="btn btn-primary settings-button"
            style="left:38.658%; top:97.042%;"
            title="Impostazioni Casing Tanks"
            (click)="openSettingsDialog()">
      <i class="fas fa-cog"></i>
    </button>

    <!-- RESET DEI TOTALIZZATORI
         Ricalcano i rettangoli RESET_V506, RESET_V509 e RESET_V512 del disegno, che qui
         non vengono riportati: come i bottoni PID sono pulsanti HTML in percentuale sul
         viewBox (left/top = centro, la classe applica translate(-50%,-50%)). A differenza
         dei RESET di Silos Discharge non azzerano una parola: dal PC si alza e basta un bit
         di comando (FROM_HMI_RESET_BCAC / _CAC / _BTFC) e l'azzeramento lo fa il PLC, che
         per ogni cilindro mette a zero DUE totalizzatori, quello del casing e quello del
         tabacco. La conferma e' la stessa finestra dei comandi globali della navbar,
         perche' i valori azzerati non si recuperano. -->
    <button type="button"
            class="btn btn-warning reset-button"
            style="left:96.000%; top:21.223%; width:4.075%; height:2.659%;"
            [swal]="{title:'Azzerare i totalizzatori del BCAC?', text:'Vanno a zero tutti e due: il casing (V505) e il tabacco (V506). I valori attuali non si recuperano!', icon:'warning', showCancelButton:true, confirmButtonText:'Sì, azzera!', cancelButtonText:'Annulla', showCloseButton:true, customClass: {confirmButton:'btn btn-lg btn-warning',cancelButton: 'btn btn-lg btn-default'}}"
            (confirm)="onResetTotalizzatoriBCAC()">
      RESET
    </button>
    <button type="button"
            class="btn btn-warning reset-button"
            style="left:96.000%; top:50.941%; width:4.075%; height:2.659%;"
            [swal]="{title:'Azzerare i totalizzatori del CAC?', text:'Vanno a zero tutti e due: il casing (V508) e il tabacco (V509). I valori attuali non si recuperano!', icon:'warning', showCancelButton:true, confirmButtonText:'Sì, azzera!', cancelButtonText:'Annulla', showCloseButton:true, customClass: {confirmButton:'btn btn-lg btn-warning',cancelButton: 'btn btn-lg btn-default'}}"
            (confirm)="onResetTotalizzatoriCAC()">
      RESET
    </button>
    <button type="button"
            class="btn btn-warning reset-button"
            style="left:96.000%; top:80.520%; width:4.075%; height:2.659%;"
            [swal]="{title:'Azzerare i totalizzatori del BTFC?', text:'Vanno a zero tutti e due: il casing (V511) e il tabacco (V512). I valori attuali non si recuperano!', icon:'warning', showCancelButton:true, confirmButtonText:'Sì, azzera!', cancelButtonText:'Annulla', showCloseButton:true, customClass: {confirmButton:'btn btn-lg btn-warning',cancelButton: 'btn btn-lg btn-default'}}"
            (confirm)="onResetTotalizzatoriBTFC()">
      RESET
    </button>




  </div>
</div>
