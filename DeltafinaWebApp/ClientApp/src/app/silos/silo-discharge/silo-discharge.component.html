<!--
  TITOLO A TRE COLONNE

  Stessa impostazione delle pagine Slicer: a sinistra icona + nome pagina, in mezzo i
  comandi di zona, a destra il badge di stato e, in fondo, lo switcher "Mostra Nomi".
  Le due colonne laterali hanno la stessa larghezza (flex:1), cosi' il blocco delle
  label e dei pulsanti resta centrato rispetto a tutta la riga del titolo e non solo
  allo spazio che avanza a destra.
-->
<h4 class="font-weight-bold py-3 mb-4 silo-title" style="padding-top: 0px !important; ">
  <span class="silo-title-left">
    <span class="title-icon-box">
      <img src="assets/svg/svg-icon/silo-icon.svg" alt="Silos Discharge" />
    </span>
    <span class="silo-title-text">Silos Discharge</span>

    <!-- Comandi di zona (DB120 - FROM_HMI) raccolti sotto un pulsante: la testata resta
         pulita e i comandi restano a un click. Il pannello e' in posizione assoluta
         rispetto a .zone-cmd, quindi non allarga la testata, e resta aperto finche' non
         si ripreme il pulsante, cosi' si possono dare due comandi di fila (es. AUTO e
         poi START). Mode 0=man / 1=AUT, State 0=stop / 1=start.
         Zona 3.2 = Silo Discharge Line. -->
    <span class="zone-cmd">
      <button type="button" class="btn btn-primary btn-sm zone-cmd-toggle" (click)="cmdOpen = !cmdOpen">
        <i class="fas fa-sliders-h"></i> Comandi
        <i class="fas" [ngClass]="cmdOpen ? 'fa-caret-up' : 'fa-caret-down'"></i>
      </button>
      <!-- Il feedback sta accanto ai pulsanti che lo comandano: il modo operativo a
           destra di MAN/AUTO, lo stato a destra di STOP/START. Prima erano due badge
           in testata, fuori dal menu. -->
      <div class="zone-cmd-panel" *ngIf="cmdOpen">
        <span class="silo-cmd-group">
          <span class="silo-cmd-label">Modalità Operativa</span>
          <button (click)="onZoneMode(TagList.FROM_HMI_Zn_3_2_Mode_mn_AUT, 'Zona 3.2', false)" [ngClass]="!TagList.FROM_HMI_Zn_3_2_Mode_mn_AUT.value ? 'btn btn-primary' : 'btn btn-default'" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;margin-right:4px;vertical-align:middle;">MAN</button>
          <button (click)="onZoneMode(TagList.FROM_HMI_Zn_3_2_Mode_mn_AUT, 'Zona 3.2', true)" [ngClass]="TagList.FROM_HMI_Zn_3_2_Mode_mn_AUT.value ? 'btn btn-primary' : 'btn btn-default'" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;vertical-align:middle;">AUTO</button>
          <span class="zone-cmd-badge">
            <span *ngIf="TagList.FROM_HMI_Zn_3_2_Mode_mn_AUT.value" class="badge badge-primary" style="font-size:12px;vertical-align:middle;">AUTOMATICO</span>
            <span *ngIf="!TagList.FROM_HMI_Zn_3_2_Mode_mn_AUT.value" class="badge badge-warning" style="font-size:12px;vertical-align:middle;">MANUALE</span>
          </span>
        </span>
        <span class="silo-cmd-group">
          <span class="silo-cmd-label">Stato di zona</span>
          <button (click)="onZoneState(TagList.FROM_HMI_Zn_3_2_State_off_ON, 'Zona 3.2', false)" class="btn btn-danger" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;margin-right:4px;vertical-align:middle;"><i class="fas fa-square"></i> STOP</button>
          <button (click)="onZoneState(TagList.FROM_HMI_Zn_3_2_State_off_ON, 'Zona 3.2', true)" class="btn btn-success" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;vertical-align:middle;"><i class="fas fa-play"></i> START</button>
          <span class="zone-cmd-badge">
            <span *ngIf="TagList.FROM_HMI_Zn_3_2_State_off_ON.value" class="badge badge-success" style="font-size:12px;vertical-align:middle;">IN MARCIA</span>
            <span *ngIf="!TagList.FROM_HMI_Zn_3_2_State_off_ON.value" class="badge badge-secondary" style="font-size:12px;vertical-align:middle;">FERMA</span>
          </span>
        </span>
      </div>
    </span>

  </span>

  <!-- Feedback di zona (DB121 - TO_HMI): il PLC alza All_ON quando tutte le utenze
       della zona sono in marcia. Sta al centro della testata, fra titolo e allarmi. -->
  <span class="silo-title-center">
    <span *ngIf="allOn()" class="badge badge-success" style="font-size:12px;vertical-align:middle;">TUTTE LE UTENZE IN MARCIA</span>
  </span>

  <!-- Colonna di destra: gli allarmi di zona e, in fondo a destra, lo switcher. -->
  <span class="silo-title-right">
    <!-- Allarmi cumulativi di zona (DB121 - TO_HMI): compaiono solo quando il PLC li
         segnala. MOL_nok = scatto termico cumulativo della zona, DAC_ok a 0 = almeno
         un sezionatore aperto. Lampeggiano, come il riquadro sulla dashboard. -->
    <span *ngIf="molAlarm()" class="badge badge-danger zona-allarme-badge" style="font-size:12px;vertical-align:middle;margin-right:6px;">SCATTO TERMICO</span>
    <span *ngIf="dacAlarm()" class="badge badge-danger zona-allarme-badge" style="font-size:12px;vertical-align:middle;margin-right:6px;">SEZIONATORE APERTO</span>
    <label class="switcher">
      <input type="checkbox" class="switcher-input" [(ngModel)]="showName">
      <span class="switcher-indicator">
        <span class="switcher-yes"></span>
        <span class="switcher-no"></span>
      </span>
      <span class="switcher-label">Mostra Nomi</span>
    </label>
  </span>
</h4>

        <!-- CORNICE SETTINGS DI PRODUZIONE -->
        <g inkscape:groupmode="layer"
           id="Produzione"
           inkscape:label="Produzione">
          <rect style="display:inline;opacity:0.5;fill:#000000;fill-opacity:0;fill-rule:evenodd;stroke:#765700;stroke-width:1.575;stroke-linecap:square;stroke-miterlimit:2;stroke-dasharray:none;stroke-opacity:1;paint-order:stroke fill markers"
                id="rect1-5"
                width="100.65544"
                height="111.98591"
                x="372.7421"
                y="92.604187"
                rx="1.2975502"
                ry="2.0989866" />
          <!--
            SILI DA SCARICARE (DB190 - V318) - cornice rect1-5

            Stessa impostazione dei pannelli impostazioni di silo-fill: si sceglie e si
            conferma con l'OK, con il log del parametro prima della scrittura.

            Sta in un <foreignObject> e non in un <div> sovrapposto perche' cosi' e'
            l'SVG a scalarlo: il contenuto vive nelle unita' utente del viewBox, quindi
            si ridimensiona insieme al sinottico senza JavaScript. Il <g> attorno
            riporta le unita' a misure HTML normali: il pannello e' impaginato a 380 px,
            quindi scale = (larghezza_cornice - 3) / 380 e l'altezza del foreignObject e'
            (altezza_cornice - 3) / scale. I 3 sono l'inset che tiene il pannello dentro
            il bordo del rettangolo, che ha stroke-width 1,575.
              rect1-5 = 100,65544 x 111,98591
              scale   = (100,65544 - 3) / 380        = 0,2569880
              height  = (111,98591 - 3) / 0,2569880  = 424,09
            La larghezza di impaginazione (380) e' scelta perche' il testo si legga a
            circa 13 px come nel pannello di silo-fill: con il sinottico largo 1600 px
            il fattore complessivo e' 0,2570 x 3,36 = circa 0,86, quindi un font di 15 px
            si legge a 12,9 px. Se ridisegni la cornice in Inkscape rifai questi tre
            numeri: la cornice a video e' 338 x 376 px.
            L'altezza che avanza la assorbe il pannello, che e' un flex in colonna con i
            pulsanti spinti in fondo (margin-top:auto in silo-discharge.css): cosi' non
            serve ritoccare il CSS a ogni ridimensionamento della cornice.
          -->
          <g transform="translate(374.24210,94.10419) scale(0.2569880)">
            <foreignObject x="0"
                           y="0"
                           width="380"
                           height="424.09">
              <div xmlns="http://www.w3.org/1999/xhtml" class="silo-settings-panel">

                <div class="section-title"><h5>SILI DA SCARICARE</h5></div>

                <!-- Quello che il PLC ha adesso, per non dover indovinare cosa c'e' scritto
                     guardando le spunte: le checkbox sotto sono la proposta, questo e' il
                     valore attivo. -->
                <div class="silo-current">
                  <span class="silo-current-label">Attuale</span>
                  <span class="silo-current-value">{{TagList.VAR_V318.value}}</span>
                </div>

                <!-- Una checkbox per sorgente. L'ordine delle cifre lo da' DISCHARGE_SOURCES
                     nel componente, non l'ordine in cui si spunta: 4, 2 e 3 fanno comunque 234. -->
                <div class="silo-sources-grid">
                  <label class="silo-source" *ngFor="let sorgente of DISCHARGE_SOURCES; let i = index">
                    <input type="checkbox" [(ngModel)]="dischargeSelection[i]" />
                    <span>Sorgente {{sorgente}}</span>
                  </label>
                </div>

                <!-- OK scrive sul PLC il numero composto (0 se non c'e' nessuna spunta),
                     ANNULLA svuota le caselle e basta: non tocca il valore sul PLC. -->
                <div class="silo-panel-actions">
                  <span class="silo-panel-preview">Nuovo: <strong>{{dischargeSilosValue}}</strong></span>
                  <button class="btn btn-success" type="button" (click)="onDischargeSilosConfirm()">OK</button>
                  <button class="btn btn-secondary" type="button" (click)="onDischargeSilosCancel()">ANNULLA</button>
                </div>

              </div>
            </foreignObject>
          </g>
        </g>

      </svg>


      <!-- Bottoni PID: pulsanti HTML Bootstrap veri, sovrapposti al disegno. Non stanno
       dentro l'SVG (un <button> nel namespace SVG non viene disegnato) ma nel div
       contenitore, posizionati in percentuale sul viewBox 476.24999 x 216.95824 cosi'
       restano agganciati al punto giusto anche quando il sinottico si ridimensiona.
       BFD_VSD  = HMI_PID_11 - portata tabacco nastro B46
       S1_4_VSD = HMI_PID_12 - portata tabacco nastro F34
       BOC: HMI_PID_9 (steam) e HMI_PID_10 (water)
       VOC: HMI_PID_7 (steam) e HMI_PID_8 (water)
       Le percentuali sono il CENTRO del pulsante, non l'angolo: .pid-button ha
       transform: translate(-50%,-50%). Quella di F34 ricalca il gruppo BTN_PID_F34
       del disegno (layer PID di silo_discharge.svg), che qui non viene riportato. -->
      <!-- Il bottone di BFD_VSD e' disegnato dentro il riquadro del nastro pesa B46, quindi
           segue la stessa condizione del riquadro: senza il consenso di linea sparisce anche
           lui, altrimenti resterebbe un pulsante sospeso sul vuoto che apre il loop di un
           nastro che il sinottico dichiara fuori linea. -->
      <button type="button"
              class="btn btn-dark pid-button"
              style="left:4.261%;top:3.421%;width:3.350%;height:3.170%;"
              *ngIf="TagList.FROM_HMI_Zn_3_2_SILO3_4_Zn_2_1.value"
              (click)="openPidDialog('BFD_VSD', $event)">
        PID
      </button>
      <button type="button"
              class="btn btn-dark pid-button"
              style="left:33.512%;top:63.432%;width:4.640%;height:2.472%;"
              (click)="openPidDialog('S1_4_VSD', $event)">
        PID
      </button>
      <!-- BOC e VOC hanno due loop ciascuno: il primo bottone e' il vapore, il secondo
       l'acqua, nello stesso ordine delle due label sopra la macchina (giallo = steam,
       celeste = water), quindi la scritta sul bottone resta PID come sugli altri.
       Sono a fianco della rispettiva macchina, negli spazi liberi del disegno. -->
      <button type="button"
              class="btn btn-dark pid-button"
              style="left:69.164%;top:6.244%;width:3.129%;height:3.172%;"
              (click)="openPidDialog('BOC_STM', $event)">
        PID
      </button>
      <button type="button"
              class="btn btn-dark pid-button"
              style="left:69.121%;top:9.673%;width:3.129%;height:3.172%;"
              (click)="openPidDialog('BOC_H2O', $event)">
        PID
      </button>
      <button type="button"
              class="btn btn-dark pid-button"
              style="left:89.129%;top:6.244%;width:3.129%;height:3.172%;"
              (click)="openPidDialog('VOC_STM', $event)">
        PID
      </button>
      <button type="button"
              class="btn btn-dark pid-button"
              style="left:89.129%;top:9.673%;width:3.129%;height:3.172%;"
              (click)="openPidDialog('VOC_H2O', $event)">
        PID
      </button>

      <!-- Azzeramento del totalizzatore del nastro pesa B46. Come i bottoni PID e' un
           pulsante HTML sovrapposto al disegno: le percentuali ricalcano il rettangolo
           RESET_TOT_B46 del layer RESET di silo_discharge.svg, che qui non viene
           riportato. Il totalizzatore e' un contatore di lotto: un tocco per sbaglio lo
           perderebbe senza modo di rimetterlo, quindi la scrittura passa dalla finestra
           di conferma swal, la stessa dei comandi globali della navbar.
           Segue il riquadro del suo nastro pesa: senza il consenso di linea il riquadro
           non c'e' e il pulsante non avrebbe niente da azzerare.
           F34 non ha piu' il suo RESET: e' sparito dal disegno insieme al vecchio
           riquadro del nastro pesa. -->
      <button type="button"
              class="btn btn-warning reset-button"
              style="left:2.351%;top:15.588%;width:3.563%;height:1.927%;"
              *ngIf="TagList.FROM_HMI_Zn_3_2_SILO3_4_Zn_2_1.value"
              [swal]="{title:'Azzerare il totalizzatore del nastro pesa B46?', text:'Il valore attuale non si recupera!', icon:'warning', showCancelButton:true, confirmButtonText:'Sì, azzera!', cancelButtonText:'Annulla', showCloseButton:true, customClass: {confirmButton:'btn btn-lg btn-warning',cancelButton: 'btn btn-lg btn-default'}}"
              (confirm)="onResetTotalizerB46()">
        RESET
      </button>

    </div>

    <!-- La card dei comandi di zona che stava qui e' ora nel titolo della pagina (h4). -->

  </div>
</div>
