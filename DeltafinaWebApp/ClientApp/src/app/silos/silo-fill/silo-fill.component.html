<!--
  TITOLO A TRE COLONNE

  Stessa impostazione delle pagine Slicer: a sinistra icona + nome pagina, in mezzo i
  comandi di zona, a destra il badge di stato e, in fondo, lo switcher "Mostra Nomi".
  Le due colonne laterali hanno la stessa larghezza (flex:1), cosi' il blocco delle
  label e dei pulsanti resta centrato rispetto a tutta la riga del titolo e non solo
  allo spazio che avanza a destra.
-->
<h4 class="font-weight-bold py-3 mb-4 silo-title" style="padding-top: 0px !important; ">
  <span class="silo-title-left">
    <span class="title-icon-box">
      <img src="assets/svg/svg-icon/silo-icon.svg" alt="Silos Fill" />
    </span>
    <span class="silo-title-text">Silos Fill</span>

    <!-- Comandi di zona (DB120 - FROM_HMI) raccolti sotto un pulsante: la testata resta
         pulita e i comandi restano a un click. Il pannello e' in posizione assoluta
         rispetto a .zone-cmd, quindi non allarga la testata, e resta aperto finche' non
         si ripreme il pulsante, cosi' si possono dare due comandi di fila (es. AUTO e
         poi START). Mode 0=man / 1=AUT, State 0=stop / 1=start.
         Zona 3.1 = Silo Fill System. -->
    <span class="zone-cmd">
      <button type="button" class="btn btn-primary btn-sm zone-cmd-toggle" (click)="cmdOpen = !cmdOpen">
        <i class="fas fa-sliders-h"></i> Comandi
        <i class="fas" [ngClass]="cmdOpen ? 'fa-caret-up' : 'fa-caret-down'"></i>
      </button>
      <!-- Il feedback sta accanto ai pulsanti che lo comandano: il modo operativo a
           destra di MAN/AUTO, lo stato a destra di STOP/START. Prima erano due badge
           in testata, fuori dal menu. -->
      <div class="zone-cmd-panel" *ngIf="cmdOpen">
        <span class="silo-cmd-group">
          <span class="silo-cmd-label">Modalità Operativa</span>
          <button (click)="onZoneMode(TagList.FROM_HMI_Zn_3_1_Mode_mn_AUT, 'Zona 3.1', false)" [ngClass]="!TagList.FROM_HMI_Zn_3_1_Mode_mn_AUT.value ? 'btn btn-primary' : 'btn btn-default'" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;margin-right:4px;vertical-align:middle;">MAN</button>
          <button (click)="onZoneMode(TagList.FROM_HMI_Zn_3_1_Mode_mn_AUT, 'Zona 3.1', true)" [ngClass]="TagList.FROM_HMI_Zn_3_1_Mode_mn_AUT.value ? 'btn btn-primary' : 'btn btn-default'" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;vertical-align:middle;">AUTO</button>
          <span class="zone-cmd-badge">
            <span *ngIf="TagList.FROM_HMI_Zn_3_1_Mode_mn_AUT.value" class="badge badge-primary" style="font-size:12px;vertical-align:middle;">AUTOMATICO</span>
            <span *ngIf="!TagList.FROM_HMI_Zn_3_1_Mode_mn_AUT.value" class="badge badge-warning" style="font-size:12px;vertical-align:middle;">MANUALE</span>
          </span>
        </span>
        <span class="silo-cmd-group">
          <span class="silo-cmd-label">Stato di zona</span>
          <button (click)="onZoneState(TagList.FROM_HMI_Zn_3_1_State_off_ON, 'Zona 3.1', false)" class="btn btn-danger" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;margin-right:4px;vertical-align:middle;"><i class="fas fa-square"></i> STOP</button>
          <button (click)="onZoneState(TagList.FROM_HMI_Zn_3_1_State_off_ON, 'Zona 3.1', true)" class="btn btn-success" type="button" style="width:96px;font-weight:bold;padding-left:0px;padding-right:0px;vertical-align:middle;"><i class="fas fa-play"></i> START</button>
          <span class="zone-cmd-badge">
            <span *ngIf="TagList.FROM_HMI_Zn_3_1_State_off_ON.value" class="badge badge-success" style="font-size:12px;vertical-align:middle;">IN MARCIA</span>
            <span *ngIf="!TagList.FROM_HMI_Zn_3_1_State_off_ON.value" class="badge badge-secondary" style="font-size:12px;vertical-align:middle;">FERMA</span>
          </span>
        </span>
      </div>
    </span>

  </span>

  <!-- Feedback di zona (DB121 - TO_HMI): la zona 3.1 non ha un All_ON unico, ne' ha
       uno per silo (S1..S4), quindi i badge sono quattro. -->
  <span class="silo-title-center">
    <span *ngFor="let s of [1, 2, 3, 4]">
      <span *ngIf="siloOn(s)" class="badge badge-success" style="font-size:12px;vertical-align:middle;margin-right:4px;">SILO {{s}} IN MARCIA</span>
    </span>
  </span>

  <!-- Colonna di destra: gli allarmi di zona e, in fondo a destra, lo switcher. -->
  <span class="silo-title-right">
    <!-- ================= TEST TEMPORANEO =================
         Pulsante di prova: apre il popup da cui si forzano parole di stato, feedback
         DB105 e fotocellule DB121 per vedere partire le animazioni senza passare da
         /settings/tag-list. Da cancellare a fine test insieme alla cartella
         silos/silo-fill/test-plate (vedi test-plate.component.ts).
    -->
    <button type="button"
            class="btn btn-danger btn-sm"
            style="margin-right:10px;font-weight:bold;"
            (click)="openTestDialog()">
      <i class="fas fa-flask"></i> TEST
    </button>
    <!-- =============== FINE TEST TEMPORANEO =============== -->

    <!-- Allarmi cumulativi di zona (DB121 - TO_HMI): compaiono solo quando il PLC li
         segnala. MOL_nok = scatto termico cumulativo della zona, DAC_ok a 0 = almeno
         un sezionatore aperto, mCC*_SS_ok a 0 = quadro MCC senza tensione.
         Lampeggiano, come il riquadro sulla dashboard. -->
    <span *ngIf="molAlarm()" class="badge badge-danger zona-allarme-badge" style="font-size:12px;vertical-align:middle;margin-right:6px;">SCATTO TERMICO</span>
    <span *ngIf="dacAlarm()" class="badge badge-danger zona-allarme-badge" style="font-size:12px;vertical-align:middle;margin-right:6px;">SEZIONATORE APERTO</span>
    <span *ngIf="mccAlarm()" class="badge badge-danger zona-allarme-badge" style="font-size:12px;vertical-align:middle;margin-right:6px;">MCC SENZA TENSIONE</span>
    <label class="switcher">
      <input type="checkbox" class="switcher-input" [(ngModel)]="showName">
      <span class="switcher-indicator">
        <span class="switcher-yes"></span>
        <span class="switcher-no"></span>
      </span>
      <span class="switcher-label">Mostra Nomi</span>
    </label>
  </span>
</h4>

        <!-- ARROW FWD-REV CARRELLI

             Le frecce di marcia che stanno sulla sagoma delle navette. Nel disegno erano
             nel layer ARROWS_REV_FWD, che sta sopra a tutto: muovendosi col carrello
             finivano davanti ai nastri del layer Conveyor_Sotto. Adesso il disegno le
             tiene in questo layer, fra Carrelli e Conveyor_Sotto, e qui l'ordine e' lo
             stesso.

             Un gruppo per silo, che scorre insieme al carrello su cui poggia:
             la traslazione la calcola getArrowCarrelloTransform dalle stesse fotocellule
             che muovono il carrello, con la stessa transizione (silo-fill.css).

             Il layer si tiene la matrice, come ce l'hanno Carrelli e ARROWS_REV_FWD:
             in Inkscape il layer nuovo non ce l'ha e la matrice e' finita su ognuna
             delle 24 frecce (composta con il loro rotate), ma a video e' lo stesso ed
             e' qui che serve, perche' il translate dei gruppi e' nelle unita' del layer
             come la x di getCarrelloX. -->
        <g inkscape:groupmode="layer"
           id="ARROW_FWD_REV_CARRELLI"
           inkscape:label="ARROW_FWD_REV_CARRELLI"
           transform="matrix(1.1887585,0,0,1.1887585,-33.497308,-18.643254)">

          <!--
      PANNELLO IMPOSTAZIONI (ex popup "IMPOSTAZIONI SILOS FILL") - cornice rect1

      Stessi identici elementi del popup SettingCasingComponent - stessa tabella,
      stesse combobox, stessi pulsanti OK, stessa logica di scrittura - portati
      sull'interfaccia dentro la cornice superiore del layer Produzione.

      Sta in un <foreignObject> e non in un <div> sovrapposto perche' cosi' e'
      l'SVG a scalarlo: il contenuto vive nelle unita' utente del viewBox, quindi
      si ridimensiona insieme al sinottico senza JavaScript. Il <g> attorno
      riporta le unita' a misure HTML normali: il pannello e' impaginato a 460 px,
      quindi scale = (larghezza_cornice - 3) / 460 e l'altezza del foreignObject e'
      (altezza_cornice - 3) / scale. I 3 sono l'inset che tiene il pannello dentro
      il bordo del rettangolo, che ha stroke-width 1,575.
        rect1 = 135,24333 x 127,47061
        scale  = (135,24333 - 3) / 460      = 0,2874855
        height = (127,47061 - 3) / 0,2874855 = 432,96
      Se ridisegni la cornice in Inkscape vanno rifatti questi tre numeri.
    -->
          <g transform="translate(341.69516,4.0124459) scale(0.2874855)">
            <foreignObject x="0"
                           y="0"
                           width="460"
                           height="410.96">
              <div xmlns="http://www.w3.org/1999/xhtml" class="silo-settings-panel">

                <div class="section-title"><h5>TIPO DI RIEMPIMENTO SILOS</h5></div>
                <div class="table-responsive">
                  <table class="table table-striped table-bordered card-table">
                    <thead>
                      <tr>
                        <th>PARAMETRO</th>
                        <th>ATTUALE</th>
                        <th>NUOVO</th>
                        <th>&nbsp;</th>
                      </tr>
                    </thead>
                    <tbody>

                      <!-- V310: a zero ogni silo segue il proprio setpoint, altrimenti comanda lui -->
                      <tr>
                        <td style="vertical-align:middle;">
                          Setpoint tipi di riempimento globale Silos
                        </td>
                        <td style="vertical-align:middle;">
                          {{siloList.FILL_TYPE_GLOBAL_STR}}
                        </td>
                        <td class="text-right" style="vertical-align:middle;">
                          <select class="form-control" [(ngModel)]="newFillTypeGlobal">
                            <option [ngValue]="0">Ogni silo il suo</option>
                            <option [ngValue]="1">1/4</option>
                            <option [ngValue]="2">2/4</option>
                            <option [ngValue]="3">4/4</option>
                          </select>
                        </td>
                        <td class="text-right" style="vertical-align:middle;">
                          <button class="btn btn-success" type="button" (click)="onFillTypeGlobalConfirm()">OK</button>
                        </td>
                      </tr>

                      <!-- V1111..V1114: modificabili solo con il setpoint globale a zero -->
                      <tr *ngFor="let silo of siloList.silos; let i = index">
                        <td style="vertical-align:middle;">
                          Setpoint tipo di riempimento silo {{i + 1}}
                        </td>
                        <!-- Con il globale diverso da zero comanda lui: il setpoint del
                  singolo silo resta scritto sul PLC ma non e' quello applicato,
                  quindi non lo si mostra per non farlo sembrare attivo. -->
                        <td style="vertical-align:middle;">
                          <span *ngIf="siloList.FILL_TYPE_PER_SILO">{{silo.FILL_TYPE_STR}}</span>
                        </td>
                        <td class="text-right" style="vertical-align:middle;">
                          <select class="form-control" [(ngModel)]="newFillType[i]" [disabled]="!siloList.FILL_TYPE_PER_SILO">
                            <option [ngValue]="1">1/4</option>
                            <option [ngValue]="2">2/4</option>
                            <option [ngValue]="3">4/4</option>
                          </select>
                        </td>
                        <td class="text-right" style="vertical-align:middle;">
                          <button class="btn btn-success" type="button" [disabled]="!siloList.FILL_TYPE_PER_SILO" (click)="onFillTypeConfirm(i)">OK</button>
                        </td>
                      </tr>

                    </tbody>
                  </table>
                </div>

              </div>
            </foreignObject>
          </g>

          <!--
      SILO DI DESTINAZIONE DELLE DUE LINEE - cornice rect1-5

      Stessa struttura del pannello sopra (PARAMETRO / ATTUALE / NUOVO / OK) e
      stessa logica: si sceglie nella combobox e si conferma con il pulsante, con
      il log del parametro prima della scrittura. Stessa costruzione geometrica:
        rect1-5 = 135,24333 x 55
        scale  = (135,24333 - 3) / 460  = 0,2874855   (uguale a quello sopra,
                                                       le due cornici sono larghe uguale)
        height = (55 - 3) / 0,2874855   = 180,879

      La cornice e' stata alzata da 36 a 55 unita' e al pannello e' stato aggiunto il
      titolo "SILOS DA RIEMPIRE": con lo spazio in piu' il carattere torna a 14 px
      (circa 13,5 px a video, contro i 14,5 del pannello sopra) invece dei 12 di
      prima. Titolo, intestazione e due righe riempiono il 92% dell'altezza, la
      stessa proporzione della tabella dei setpoint. Le misure sono in
      .silo-lines-panel, in silo-fill.css: se la cornice cambia ancora vanno rifatti
      height qui sopra e le dimensioni del testo la'.
    -->
          <g transform="translate(341.69516,134.12886) scale(0.2874855)">
            <foreignObject x="0"
