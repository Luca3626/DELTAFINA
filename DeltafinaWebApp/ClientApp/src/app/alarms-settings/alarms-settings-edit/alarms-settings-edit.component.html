<h4 class="font-weight-bold py-3 mb-4">
  <span class="text-muted font-weight-light">IMPOSTAZIONI ALLARMI /</span> Mancata comunicazione con quadro pompe di sbrinamento
</h4>

<div class="card mb-4">
  <h6 class="card-header">
    Generali
  </h6>
  <div class="card-body">
    <!--<form>-->
    <div class="form-group row">
      <label class="col-form-label col-sm-2 text-sm-right">Nome</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" [(ngModel)]="name" placeholder="Nome allarme">
      </div>
    </div>
    <div class="form-group row">
      <label class="col-form-label col-sm-2 text-sm-right">Zona/Tipologia</label>
      <div class="col-sm-10">
        <ng-select class="ng-select-secondary" [items]="selectZones"
                   [multiple]="true"
                   [closeOnSelect]="true"
                   bindLabel="label"
                   bindValue="value"
                   placeholder="Seleziona Zone"
                   [(ngModel)]="multipleSelectZoneValue"
                   [hideSelected]="true"
                   [dropdownPosition]="'top'"
                   [disabled]="disabled">
          <!--[multiple]="true"-->
        </ng-select>
      </div>
    </div>
    <div class="form-group row">
      <label class="col-form-label col-sm-2 text-sm-right">Priorità</label>
      <div class="col-sm-10">
        <select class="custom-select">
          <!--<option *ngFor="let step of stepItems" [value]="step.id">{{step.name}}</option>-->
          <option>Priorità Alta</option>
          <option>Priorità Media</option>
          <option>Priorità Bassa</option>
        </select>
        <!--<ng-select class="ng-select-secondary" [items]="selectTags"
               [closeOnSelect]="true"
               bindLabel="label"
               bindValue="value"
               placeholder="Seleziona Priorità"
               [(ngModel)]="multipleSelectTagValue"
               [hideSelected]="true"
               [dropdownPosition]="'top'"
               [disabled]="disabled">
      [multiple]="true"
          </ng-select>-->
      </div>
    </div>
    <div class="form-group row">
      <label class="col-form-label col-sm-2 text-sm-right">Segnalazione agli utenti</label>
      <div class="col-sm-10">
        <ng-select class="ng-select-secondary" [items]="selectUsers"
                   [multiple]="true"
                   [closeOnSelect]="false"
                   bindLabel="label"
                   bindValue="value"
                   groupBy="timezone"
                   [selectableGroup]="true"
                   placeholder="Seleziona Utenti"
                   [(ngModel)]="multipleSelectUserAlarmON"
                   [hideSelected]="true"
                   [dropdownPosition]="'top'"
                   [disabled]="disabled">
        </ng-select>
      </div>
    </div>
    <div class="form-group row">
      <label class="col-form-label col-sm-2 text-sm-right">Segnalazione alle email</label>
      <div class="col-sm-10">
        <tag-input class="ngx-chips-secondary"
                   placeholder="+ Indirizzo email"
                   [(ngModel)]="items"
                   [editable]="!disabled"
                   [disable]="disabled">
          <!--<tag-input-dropdown [showDropdownIfEmpty]="true"
                            [autocompleteItems]="autocompleteItems">
        </tag-input-dropdown>-->
        </tag-input>
      </div>
    </div>
    <div class="form-group row">
      <label class="col-form-label col-sm-2 text-sm-right">Notifica riconoscimento agli utenti</label>
      <div class="col-sm-10">
        <ng-select class="ng-select-secondary" [items]="selectUsers"
                   [multiple]="true"
                   [closeOnSelect]="false"
                   bindLabel="label"
                   bindValue="value"
                   groupBy="timezone"
                   [selectableGroup]="true"
                   placeholder="Seleziona Utenti"
                   [(ngModel)]="multipleSelectUserAlarmOFF"
                   [hideSelected]="true"
                   [dropdownPosition]="'top'"
                   [disabled]="disabled">
        </ng-select>
      </div>
    </div>
    <div class="form-group row">
      <label class="col-form-label col-sm-2 text-sm-right">Notifica riconoscimento alle email</label>
      <div class="col-sm-10">
        <tag-input class="ngx-chips-secondary"
                   placeholder="+ Indirizzo email"
                   [(ngModel)]="items"
                   [editable]="!disabled"
                   [disable]="disabled">
          <!--<tag-input-dropdown [showDropdownIfEmpty]="true"
                            [autocompleteItems]="autocompleteItems">
        </tag-input-dropdown>-->
        </tag-input>
      </div>
    </div>

</div>
