<h4 class="font-weight-bold py-3 mb-4 cabinet-title" style="padding-top: 0px !important; border-bottom: 2px solid #696b6e;">
  <span class="cabinet-title-left">
    <span class="cabinet-title-text">Cabinets - Quadri elettrici</span>

    <!-- Testata standard delle pagine sinottiche (vedi zona-2-1.component.html).
         Qui non ci sono ancora il pulsante "Comandi" ne' i badge di zona: i quadri
         non hanno tag sul PLC. Quando arriveranno, si copiano da li' il blocco
         <span class="zone-cmd"> e le classi .zone-cmd* del foglio di stile. -->
  </span>

  <!-- Colonna centrale: libera, ospitera' il feedback cumulativo dei quadri. -->
  <span class="cabinet-title-center"></span>

  <!-- Colonna di destra: lo switcher che mostra/nasconde le etichette dei quadri
       (sigla sul fronte e sulla pianta). -->
  <span class="cabinet-title-right">
    <label class="switcher">
      <input type="checkbox" class="switcher-input" [(ngModel)]="showName">
      <span class="switcher-indicator">
        <span class="switcher-yes"></span>
        <span class="switcher-no"></span>
      </span>
      <span class="switcher-label">Mostra Nomi</span>
    </label>
  </span>
</h4>
