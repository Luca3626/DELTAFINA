      <h6 class="card-header text-center" style="padding: 0.5rem 1rem;">
        TUTTO IN AUTO
      </h6>
      <div class="card-body" style="padding: 0.5rem!important;">
        <div class="text-center" style="margin: 0px auto;line-height:38px;vertical-align:middle">
          <span *ngIf="TagList.FDB_ZONA_CARICO_ROTTAME_ESTERNO_UTENZE_READYAUTREM.value" class="badge badge-success">READY</span>
          <span *ngIf="!TagList.FDB_ZONA_CARICO_ROTTAME_ESTERNO_UTENZE_READYAUTREM.value" class="badge badge-warning">READY</span>
        </div>
      </div>
    </div>
  </div>
  <div class='col-sm-3'>
    <div class="card mb-4">
      <h6 class="card-header text-center" style="padding: 0.5rem 1rem;">
        STATO
      </h6>
      <div class="card-body" style="padding: 0.5rem!important;">
        <div class="text-center" style="margin: 0px auto;line-height:38px;vertical-align:middle">
          <span *ngIf="CaricoRottameState != 'PRONTO'" class="badge badge-info" style="font-size:14px;font-weight:bold;">{{CaricoRottameState}}</span><span *ngIf="CaricoRottameState == 'PRONTO'" style="font-size:14px;font-weight:bold;">{{CaricoRottameState}}</span>
        </div>
      </div>
    </div>
  </div>
  <div class='col-sm-4'>
    <div class="card mb-4">
      <h6 class="card-header text-center" style="padding: 0.5rem 1rem;">
        MODALITA'
      </h6>
      <div class="card-body" style="padding: 0.5rem!important;">
        <div class="form-row" style="width:100%;">
          <div class="col-sm-4">
            <button (click)="onMAN()" style="width:100%;font-weight:bold;padding-left:0px;padding-right:0px;" [ngClass]="TagList.FDB_ZONA_CARICO_ROTTAME_ESTERNO_UTENZE_MANREM.value ? 'btn btn-primary' : 'btn btn-default'">MAN</button>
          </div>
          <div class="col-sm-4 text-center">
            <button (click)="onLOC()" style="width:100%;font-weight:bold;padding-left:0px;padding-right:0px;" [ngClass]="TagList.FDB_ZONA_CARICO_ROTTAME_ESTERNO_UTENZE_LOC.value ? 'btn btn-primary' : 'btn btn-default'">LOC</button>
          </div>
          <div class="col-sm-4">
            <button (click)="onAUT()" style="font-weight:bold;width:100%;padding-left:0px;padding-right:0px;" [ngClass]="TagList.FDB_ZONA_CARICO_ROTTAME_ESTERNO_UTENZE_AUTREM.value ? 'btn btn-primary pull-right' : 'btn btn-default pull-right'">AUTO</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class='col-sm-3'>
    <div class="card mb-4">
      <h6 class="card-header text-center" style="padding: 0.5rem 1rem;">
        COMANDI
      </h6>
      <div class="card-body" style="padding: 0.5rem!important;">
        <div class="form-row" style="width:100%;">
          <div class="col-sm-6">
            <button (click)="onSTOP()" style="width:100%;max-width:120px" class="btn btn-danger"><i class="fas fa-square"></i> STOP</button>
          </div>
          <div class="col-sm-6">
            <button (click)="onSTART()" style="width:100%;max-width:120px" class="btn btn-success pull-right"><i class="fas fa-play"></i> START</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
