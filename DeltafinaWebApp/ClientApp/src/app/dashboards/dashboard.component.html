
<h4 class="font-weight-bold py-3 mb-4 dashboard-title" style="">
  <span class="dashboard-title-left">
    <span class="title-icon-box">
      <img src="assets/svg/svg-icon/dashboard-icon.svg" alt="Dashboard" />
    </span>
    <span class="dashboard-title-text">Panoramica Impianto</span>
  </span>

  <span class="dashboard-title-right">
    <span style="font-weight:bold;">{{alarmsData.length}} Allarmi</span>

    <!-- Switcher in fondo a destra, dalla parte opposta del titolo. Mostra e nasconde
         la tabella degli allarmi qui sotto: sulla dashboard non ci sono utenze
         disegnate, quindi il vecchio "Mostra nomi utenze" delle pagine di zona qui
         non aveva niente da accendere. -->
    <label class="switcher">
      <input type="checkbox" class="switcher-input" [(ngModel)]="alarmsVisible">
      <span class="switcher-indicator">
        <span class="switcher-yes"></span>
        <span class="switcher-no"></span>
      </span>
      <span class="switcher-label">Mostra allarmi</span>
    </label>
  </span>
</h4>

<div class="card mb-4" style="max-height:137px;" *ngIf="alarmsVisible">
  <div class="table-responsive mb-4" style="margin-bottom:0px!important">
    <table class="table mb-0 card-table">
      <!--<thead>
        <tr>
          <th>ALLARME</th>
          <th>ZONA</th>
          <th>UTENZA</th>
          <th>IN</th>
          <th>OUT</th>
          <th>STATE</th>
        </tr>
      </thead>-->
      <tbody style="color:white">
        <tr *ngFor="let item of alarmsData" [ngClass]="[item.state == 'I' ? 'bg-danger' : 'bg-success'  ]">
          <th>{{ item.textLang1 }}  <small> ({{ item.tagName }})</small></th>
          <th>{{ item.zone }}</th>
          <!--<th>{{ item.plcName.toUpperCase() }}</th>-->
          <th>{{ item.machineUser }}</th>
          <th>{{ item.dateIN | date:'dd-MM-yyyy HH:mm' }}</th>
          <th>{{ item.dateOUT | date:'dd-MM-yyyy HH:mm' }}</th>
          <th>{{ item.state }}</th>
        </tr>
      </tbody>
    </table>
  </div>
</div>

    Sostituzioni:
    ="../../assets/svg/custom => ="../../assets/svg/custom
    ="../../assets/svg/groov => ="../../assets/svg/groov

    POMPE:
    xlink:href="../../assets/svg/groov/pump1_blue.svg" -> [attr.xlink:href]="motorList.P1.SVG_MOTOR" style="cursor:pointer" (click)="openMotorDialogBySVG($event)"

    MOTOR:

       inkscape:label="FX_P1" />

        <rect style="mix-blend-mode:normal;fill:#cdc5b1;fill-opacity:0;fill-rule:evenodd;stroke:#000000;stroke-width:0.33311;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:2;stroke-dasharray:none;stroke-opacity:1;paint-order:stroke fill markers;filter:url(#filter3)"
              id="rect1-1"
              width="136.39586"
              height="75.646881"
              x="334.00049"
              y="20.000498"
              ry="1.2699208"
              transform="matrix(0.88866099,0,0,1.638867,56.977161,20.630087)"
              rx="2.3158519" />
        <!--
      PANNELLO "CONFIGURAZIONE PERCORSI E LINEE" - cornice rect1

      Stessi bit della pagina Parametri (IMPOSTAZIONI > Parametri > System setup,
      prima voce): stessa tabella DESCRIZIONE / ATTUALE / COMANDO, stesso switcher e
      stesso log del parametro prima della scrittura. Le righe arrivano da
      settings/setup-settings.ts, non sono ricopiate qui.

      Sul sinottico non ci sono tutte le voci del gruppo ma solo quelle che si cambiano
      in produzione (setupRows nel .ts: C80, C71, C54, C115, C114); per le altre c'e' il
      link alla pagina Parametri sotto la tabella.

      Sta in un <foreignObject> e non in un <div> sovrapposto perche' cosi' e' l'SVG
      a scalarlo: il contenuto vive nelle unita' utente del viewBox, quindi si
      ridimensiona insieme al sinottico senza JavaScript. Il <g> attorno riporta le
      unita' a misure HTML normali: il pannello e' impaginato a 390 px, quindi
      scale = (larghezza_cornice - 3) / 390 e l'altezza del foreignObject e'
      (altezza_cornice - 3) / scale. I 3 sono l'inset che tiene il pannello dentro il
      bordo del rettangolo, che ha stroke-width 1,7.
        rect1  = 119,083 x 123,927 in x=354,854 y=53,4325
        scale  = (119,083 - 3) / 390        = 0,29764918
        height = (123,927 - 3) / 0,29764918 = 406,27

      I px logici sono 390 e non 460 come nei pannelli di Silos Fill: il testo a
      video e' (font logico) x (larghezza della cornice a video / larghezza logica),
      quindi impaginare piu' stretto ingrandisce tutto senza toccare la cornice.
      390 e' il minimo per non mandare a capo le descrizioni su una riga in piu'
      (il pannello ha overflow:hidden). La larghezza logica e' rimasta 390 anche dopo
      lo sfoltimento delle voci, quindi i tre numeri qui sopra non cambiano: le poche
      righe rimaste si distribuiscono l'altezza della cornice (card-table ha height:100%).
      Se ridisegni la cornice in Inkscape vanno rifatti questi tre numeri.
    -->
        <g transform="translate(356.35361,54.93246) scale(0.29764918)">
          <foreignObject x="0"
                         y="0"
                         width="390"
                         height="406.27">
            <div xmlns="http://www.w3.org/1999/xhtml" class="setup-settings-panel">
              <div class="section-title"><h5>{{setupGroup.title}}</h5></div>
              <div class="table-responsive">
                <table class="table table-striped table-bordered card-table">
                  <thead>
                    <tr>
                      <th>DESCRIZIONE</th>
                      <th class="text-center">ATTUALE</th>
                      <th class="text-center">COMANDO</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let row of setupRows">
                      <td style="vertical-align:middle;">
                        <span class="badge badge-secondary mr-2">{{row.code}}</span>{{row.text}}
                      </td>
                      <td class="text-center" style="vertical-align:middle;">
                        <span [ngClass]="{'badge': true,
                                          'badge-success': isSetupOn(row) && !row.info,
                                          'badge-info': isSetupOn(row) && row.info,
                                          'badge-secondary': !isSetupOn(row)}">{{setupStateTxt(row)}}</span>
                      </td>
                      <td class="text-center" style="vertical-align:middle;">
                        <label class="switcher" [ngClass]="row.info ? 'switcher-info' : 'switcher-success'">
                          <input type="checkbox" class="switcher-input"
                                 [checked]="isSetupOn(row)"
                                 (change)="onSetupToggle(row, $event.target.checked)">
                          <span class="switcher-indicator">
                            <span class="switcher-yes"></span>
                            <span class="switcher-no"></span>
                          </span>
                        </label>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <!-- Il resto dei bit del gruppo (C72, C73, C77, C90, C142, C111, C64) e le
          altre aree stanno sulla pagina Parametri. Non si usa routerLink perche'
          il link vive dentro un <foreignObject>: si naviga dal componente, come
          gia' fanno le scritte del disegno. -->
              <div class="setup-settings-more">
                <a (click)="goToSettings()">Tutti i parametri &#8594;</a>
              </div>
            </div>
          </foreignObject>
        </g>
