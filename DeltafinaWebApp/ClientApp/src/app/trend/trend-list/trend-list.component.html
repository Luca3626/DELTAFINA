<h4 class="d-flex justify-content-between align-items-center w-100 font-weight-bold py-3 mb-4">
  <div>Trends</div>
  <button type="button" class="btn btn-primary rounded-pill d-block" (click)="onBnNewClick()"><span class="ion ion-md-add"></span>&nbsp; Crea Nuovo Trend</button>
</h4>

<div class="card">
  <!-- Table controls -->
  <div class="card-body">
    <div class="row">
      <div class="col">
        Per pagina: &nbsp;
        <select [(ngModel)]="perPage"
                (change)="update()"
                class="custom-select custom-select-sm d-inline-block w-auto">
          <option *ngFor="let limit of [10, 20, 30, 40, 50]">{{limit}}</option>
        </select>
      </div>
      <!--<div class="col">
        <input type="text"
               [(ngModel)]="filterVal"
               (input)="currentPage = 1; update()"
               class="form-control form-control-sm d-inline-block w-auto float-sm-right"
               placeholder="Search...">
      </div>-->
    </div>
  </div>
  <!-- / Table controls -->
  <!-- Table -->
  <hr class="border-light m-0">
  <div class="table-responsive">
    <table class="table table-striped table-bordered card-table">
      <thead>
        <tr>
          <th class="text-nowrap cursor-pointer" (click)="setSort('description')" style="min-width: 18rem">
            Descrizione<i class="ion text-muted ml-2" *ngIf="sortBy=='description'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
          </th>
          <th class="text-nowrap cursor-pointer" (click)="setSort('zoneName')" style="min-width: 18rem">
            Zona<i class="ion text-muted ml-2" *ngIf="sortBy=='zoneName'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
          </th>
          <th class="text-nowrap cursor-pointer" (click)="setSort('plcName')" style="min-width: 18rem">
            PLC<i class="ion text-muted ml-2" *ngIf="sortBy=='plcName'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
          </th>
          <th class="text-nowrap cursor-pointer" (click)="setSort('timeCycleForSave')">
            Campionamento<i class="ion text-muted ml-2" *ngIf="sortBy=='timeCycleForSave'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
          </th>
          <th class="text-nowrap cursor-pointer" (click)="setSort('lastLog')">
            Ultima Reg.<i class="ion text-muted ml-2" *ngIf="sortBy=='lastLog'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
          </th>
          <th class="text-nowrap cursor-pointer" (click)="setSort('valueType')">
            Tipo<i class="ion text-muted ml-2" *ngIf="sortBy=='valueType'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
          </th>
          <th class="text-nowrap cursor-pointer" (click)="setSort('unit')">
            UdM<i class="ion text-muted ml-2" *ngIf="sortBy=='unit'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
          </th>
          <!--<th class="text-nowrap cursor-pointer" (click)="setSort('status')">
    Status<i class="ion text-muted ml-2" *ngIf="sortBy=='status'" [ngClass]="'ion-md-arrow-' + (sortDesc ? 'down' : 'up')"></i>
  </th>-->
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <input class="form-control" type="text" (keyup)="onKey($event)" id="fDescription" name="fDescription" [(ngModel)]="filterService.trendFilters.description" placeholder="Filtra per descrizione">
          </td>
          <td>
            <input class="form-control" type="text" (keyup)="onKey($event)" id="fZoneName" name="fZoneName" [(ngModel)]="filterService.trendFilters.zoneName" placeholder="Filtra per zona">
          </td>
          <td>
            <input class="form-control" type="text" (keyup)="onKey($event)" id="fPlcName" name="fPlcName" [(ngModel)]="filterService.trendFilters.plcName" placeholder="Filtra per PLC">
          </td>
          <td>
            <input class="form-control" type="text" (keyup)="onKey($event)" id="fTimeCycleForSave" name="fTimeCycleForSave" [(ngModel)]="filterService.trendFilters.timeCycleForSave" placeholder="Filtra per campionamento">
          </td>
          <td>
            <input class="form-control" type="text" (keyup)="onKey($event)" id="fLastLog" name="fLastLog" [(ngModel)]="filterService.trendFilters.lastLog" placeholder="Filtra per ultima reg.">
          </td>
          <td>
            <input class="form-control" type="text" (keyup)="onKey($event)" id="fValueType" name="fValueType" [(ngModel)]="filterService.trendFilters.valueType" placeholder="Filtra per tipo">
          </td>
          <td>
            <input class="form-control" type="text" (keyup)="onKey($event)" id="fUnit" name="fUnit" [(ngModel)]="filterService.trendFilters.unit" placeholder="Filtra per unità di misura">
          </td>
          <td class="text-center text-nowrap align-middle">
            <a href="javascript:void(0)" class="btn btn-default btn-xs icon-btn md-btn-flat" ngbTooltip="Rimuovi Filtri" (click)="removeFilters()"><i class="ion ion-md-close"></i></a>
          </td>
        </tr>
        <tr *ngFor="let item of trendsData">
          <td class="align-middle"><a [routerLink]="['/trend/trend-edit/' + item.tagLogName]">{{item.description}}</a></td>
          <td class="align-middle">{{item.zoneName}}</td>
          <td class="align-middle">{{item.plcName}}</td>
          <td class="align-middle">{{item.timeCycleForSave}}</td>
          <td class="align-middle">{{item.lastLog | date: 'dd/MM/yyyy HH:mm'}}</td>
          <td class="align-middle">{{item.valueType}}</td>
          <td class="align-middle">{{item.unit}}</td>
          <td class="text-center text-nowrap align-middle">
            <a [routerLink]="['/trend/trend-edit/' + item.tagLogName]" class="btn btn-default btn-xs icon-btn md-btn-flat" ngbTooltip="Modifica"><i class="ion ion-md-create"></i></a>
            <!--<a href="javascript:void(0)" class="btn btn-default btn-xs icon-btn md-btn-flat" ngbTooltip="Remove"><i class="ion ion-md-close"></i></a>-->
          </td>
        </tr>
      </tbody>
    </table>

  </div>
  <!-- / Table -->
  <!-- Pagination -->
  <div class="card-body py-0">
    <div class="row">
      <div class="col-sm text-sm-left text-center pt-3">
        <span class="text-muted" *ngIf="totalItems">Page {{ currentPage }} of {{ totalPages }}</span>
      </div>
      <div class="col-sm pt-3">
        <ngb-pagination [collectionSize]="totalItems"
                        [pageSize]="perPage"
                        [(page)]="currentPage"
                        (pageChange)="update()"
                        size="sm"
                        class="d-flex justify-content-center justify-content-sm-end m-0"></ngb-pagination>
      </div>
    </div>
  </div>
  <!-- / Pagination -->
</div>
