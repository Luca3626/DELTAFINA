<h4 class="font-weight-bold py-3 mb-4">
  <span class="text-muted font-weight-light">TREND /</span> {{myTitle}}
</h4>

<form name="form" #f="ngForm" (ngSubmit)="f.form.valid && onSubmit()" appIdentityRevealed>
  <div class="card mb-4">
    <!--<h6 class="card-header">
      Dati Generali
    </h6>-->
    <div class="card-body">
      <div class="form-group">
        <label class="form-label form-label">Descrizione</label>
        <input id="description" name="description" class="form-control form-control" [ngClass]="description.invalid && (description.dirty || description.touched) && description.errors ? 'is-invalid' : ''" [(ngModel)]="trendData.description" #description="ngModel" required>
        <small *ngIf="description && description.invalid && (description.dirty || description.touched) && description.errors.required" class="invalid-feedback">La descrizione è un campo obbligatorio.</small>
      </div>
      <div class="form-group">
        <label class="form-label">Tipo Zona</label>
        <ng-select id="zoneTypes" name="zoneTypes"
                   class="ng-select-secondary" [items]="selectZoneTypes"
                   [multiple]="false"
                   [closeOnSelect]="true"
                   bindLabel="label"
                   bindValue="value"
                   placeholder="Selezione Tipo Zona"
                   [(ngModel)]="zoneType"
                   (close)="onZoneTypeFilterChange()"
                   [hideSelected]="true"
                   [disabled]="false"
                   #zoneTypes="ngModel">
        </ng-select>
      </div>
      <div class="form-group">
        <label class="form-label">Zona</label>
        <ng-select id="zones" name="zones"
                   class="ng-select-secondary" [items]="selectZones"
                   [multiple]="false"
                   [closeOnSelect]="true"
                   bindLabel="label"
                   bindValue="label"
                   placeholder="Selezione Zona"
                   [(ngModel)]="trendData.zoneName"
                   (close)="onZoneFilterChange()"
                   [hideSelected]="true"
                   #zones="ngModel">
        </ng-select>
      </div>
      <div class="form-group">
        <label class="form-label">PLC</label>
        <ng-select id="plcs" name="plcs"
                   class="ng-select-secondary" [items]="selectPlcs"
                   [multiple]="false"
                   [closeOnSelect]="true"
                   bindLabel="label"
                   bindValue="label"
                   placeholder="Selezione PLC"
                   [(ngModel)]="trendData.plcName"
                   (close)="onPlcFilterChange()"
                   [hideSelected]="true"
                   #plcs="ngModel">
        </ng-select>
      </div>
      <div class="form-group">
        <label class="form-label">Tag</label>
        <ng-select id="tags" name="tags"
                   class="ng-select-secondary" [items]="selectTags"
                   [multiple]="false"
                   [closeOnSelect]="true"
                   bindLabel="label"
                   bindValue="label"
                   placeholder="Selezione Tag"
                   [(ngModel)]="trendData.tagPlcName"
                   (close)="onTagFilterChange()"
                   [hideSelected]="true"
                   #tags="ngModel">
        </ng-select>
      </div>
      <div class="form-group">
        <label class="form-label form-label">Nuovo Nome Tag Univoco</label>
        <input id="tagLogName" name="tagLogName" class="form-control form-control" [ngClass]="tagLogName.invalid && (tagLogName.dirty || tagLogName.touched) && tagLogName.errors ? 'is-invalid' : ''" [(ngModel)]="trendData.tagLogName" #tagLogName="ngModel" required>
        <small *ngIf="tagLogName && tagLogName.invalid && (tagLogName.dirty || tagLogName.touched) && tagLogName.errors.required" class="invalid-feedback">Il nome univoco è un campo obbligatorio.</small>
      </div>
      <div class="form-row">
        <div class="form-group col-md-6">
          <label class="form-label">Tipo di Salvataggio</label>
          <select id="timeCycleForSave" name="timeCycleForSave" class="custom-select form-control form-control" [(ngModel)]="trendData.timeCycleForSave" #timeCycleForSave="ngModel" required>
            <option value="Minute" selected>Minuti</option>
          </select>
          <small *ngIf="timeCycleForSave && timeCycleForSave.invalid && (timeCycleForSave.dirty || timeCycleForSave.touched) && timeCycleForSave.errors.required" class="invalid-feedback">Campo obbligatorio.</small>
        </div>
        <div class="form-group col-md-6">
          <label class="form-label">Tempo</label>
          <select id="countCycleForSave" name="countCycleForSave" class="custom-select form-control form-control" [(ngModel)]="trendData.countCycleForSave" #countCycleForSave="ngModel" required>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15" selected>15</option>
            <option value="30">30</option>
            <option value="60">60</option>
          </select>
          <small *ngIf="countCycleForSave && countCycleForSave.invalid && (countCycleForSave.dirty || countCycleForSave.touched) && countCycleForSave.errors.required" class="invalid-feedback">Campo obbligatorio.</small>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label form-label">Decimali</label>
        <select id="roundDigit" name="roundDigit" class="custom-select form-control form-control" [(ngModel)]="trendData.roundDigit" #roundDigit="ngModel" required>
          <option value="-1">Tutti</option>
          <option value="0">0</option>
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
        <small *ngIf="roundDigit && roundDigit.invalid && (roundDigit.dirty || roundDigit.touched) && roundDigit.errors.required" class="invalid-feedback">Campo obbligatorio.</small>
      </div>
      <div class="form-group">
        <label class="form-label form-label">Tipo di Valore</label>
        <select id="valueType" name="valueType" class="custom-select form-control form-control" [(ngModel)]="trendData.valueType" #valueType="ngModel" required>
          <option value="Current Value" selected>Valore Corrente</option>
          <option value="Subtract">Differenza tra campioni</option>
        </select>
        <small *ngIf="valueType && valueType.invalid && (valueType.dirty || valueType.touched) && valueType.errors.required" class="invalid-feedback">Campo obbligatorio.</small>
      </div>
      <div class="form-group">
        <label class="form-label form-label">Unità di Misura</label>
        <input name="unit" [(ngModel)]="trendData.unit" type="text" class="form-control form-control">
      </div>
      <div *ngIf="this.tagLogName" class="text-left mt-3">
        <button type="button" class="btn btn-danger" (click)="onDelete()">Elimina</button>
      </div>
      <div class="text-right mt-3">
        <button type="submit" [disabled]="f.invalid" class="btn btn-primary">Salva</button>&nbsp;
        <!--<button type="reset" class="btn btn-default">Pulisci</button>&nbsp;-->
        <button type="button" class="btn btn-default" (click)="goToList()">Chiudi</button>
      </div>
    </div>
  </div>

</form>
